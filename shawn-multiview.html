<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE SHAWN · 멀티뷰</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script>
/* 진입 가드 — 통합 로그인 필요 */
(function(){
  try{
    var ok = localStorage.getItem('unifiedLogin')==='1' || sessionStorage.getItem('egmmGate')==='1' || localStorage.getItem('egmmAutoLogin')==='1';
    if(!ok){ location.replace('index.html'); }
  }catch(e){ location.replace('index.html'); }
})();
</script>
<style>
  :root{
    --bg:#f7f6f2; --bg-elev:#ffffff; --text:#1a1a1d; --text-dim:#55555c; --text-faint:#9a9aa0;
    --border:#e5e5e0; --accent-warm:#c9a961; --accent-soft:#f0e9d8;
    --mono:'SF Mono',ui-monospace,Menlo,monospace; --serif:'Pretendard',sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:var(--serif); color:var(--text); background:var(--bg); overflow:hidden; }

  /* THE SHAWN 디자인 프레임 */
  #mvFrame{ position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg); overflow:hidden; }
  #mvCanvasWrap{ position:relative; flex:1; margin:0; border-radius:0; overflow:hidden;
    border:0; background:
      radial-gradient(1200px 600px at 15% -10%, #fffdf7 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 120%, #f3eede 0%, transparent 55%),
      var(--bg); }
  #mvCanvas{ position:absolute; inset:0; background-size:cover; background-position:center; }

  /* 우측 상단 컨트롤 */
  #mvTop{ position:absolute; top:8px; right:10px; z-index:40; display:flex; gap:5px; align-items:center; }
  .mv-tbtn{ width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,.9); color:var(--text);
    border:1px solid var(--border); cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 10px rgba(26,26,29,.1); transition:transform .12s, border-color .14s; }
  .mv-tbtn:hover{ border-color:var(--accent-warm); transform:translateY(-1px); }

  /* 설정 패널 */
  #mvPanel{ position:absolute; top:42px; right:10px; z-index:41; width:290px; background:var(--bg-elev);
    border:1px solid var(--border); border-radius:16px; padding:18px; display:none;
    box-shadow:0 24px 70px rgba(26,26,29,.18); }
  #mvPanel.show{ display:block; }
  #mvPanel h4{ margin:0 0 12px; font-family:var(--serif); font-weight:800; font-size:15px; letter-spacing:.02em; }
  #mvPanel label{ display:block; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin:14px 0 6px; }
  #mvPanel input, #mvPanel select{ width:100%; box-sizing:border-box; border:1.5px solid var(--border); border-radius:10px; padding:9px 11px; font-size:13px; font-family:inherit; background:#fff; }
  .mv-btn{ display:inline-flex; align-items:center; gap:6px; background:var(--accent-warm); color:#fff; border:0; border-radius:10px; padding:10px 14px; font-size:13px; font-weight:700; cursor:pointer; }
  .mv-btn.ghost{ background:#fff; color:var(--text); border:1.5px solid var(--border); }
  .mv-btn.full{ width:100%; justify-content:center; margin-top:6px; }
  #mvZoom{ display:flex; align-items:center; gap:8px; }
  #mvZoom button{ width:34px; height:34px; border-radius:9px; background:#fff; border:1.5px solid var(--border); cursor:pointer; font-size:16px; }
  #mvZoomVal{ flex:1; text-align:center; font-family:var(--mono); font-size:13px; }

  /* 자유 배치 패널 */
  .mvp{ position:absolute; background:var(--bg-elev); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 10px 34px rgba(26,26,29,.14); overflow:hidden; display:flex; flex-direction:column; min-width:180px; min-height:120px; }
  .mvp.active{ box-shadow:0 14px 44px rgba(201,169,97,.28); border-color:var(--accent-warm); }
  .mvp-head{ height:34px; flex:0 0 34px; display:flex; align-items:center; gap:6px; padding:0 8px;
    background:linear-gradient(180deg,#fbfaf6,#f4f2ea); border-bottom:1px solid var(--border); cursor:move; user-select:none; }
  .mvp-head .tick{ width:5px; height:14px; border-radius:2px; background:var(--accent-warm); flex:0 0 auto; }
  .mvp-head select{ flex:1; min-width:0; border:1px solid var(--border); border-radius:7px; padding:3px 6px; font-size:11px; font-family:inherit; background:#fff; }
  .mvp-head .mvp-store{ max-width:120px; }
  .mvp-head .mvp-ext{ flex:1; }
  .mvp-head button{ flex:0 0 auto; width:24px; height:24px; border:0; border-radius:6px; background:transparent; cursor:pointer; font-size:13px; color:var(--text-dim); }
  .mvp-head button:hover{ background:#eee; }
  .mvp-body{ flex:1; position:relative; background:#fff; }
  .mvp-body iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .mvp-empty{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--text-faint); font-size:13px; }
  /* 드래그 중 iframe 이벤트 차단 */
  .mvp-body.drag-lock{ pointer-events:none; }
  .mvp-resize{ position:absolute; right:0; bottom:0; width:18px; height:18px; cursor:nwse-resize; z-index:3;
    background:linear-gradient(135deg, transparent 50%, var(--accent-warm) 50%); border-bottom-right-radius:14px; opacity:.55; }
  .mvp-resize:hover{ opacity:1; }

  #mvHint{ position:absolute; bottom:16px; left:22px; z-index:30; font-size:11px; color:var(--text-faint);
    background:rgba(255,255,255,.8); border:1px solid var(--border); border-radius:20px; padding:6px 14px; }

  /* 하단 독(Dock) — 선택된 메뉴 아이콘 */
  #mvDock{ position:absolute; left:50%; transform:translateX(-50%); bottom:12px; z-index:35;
    display:flex; gap:6px; align-items:flex-end; padding:5px 9px; border-radius:14px;
    background:rgba(255,255,255,.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(0,0,0,.05); box-shadow:0 4px 16px rgba(26,26,29,.1); }
  #mvDock:empty{ display:none; }
  .mv-dock-item{ display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
    transition:transform .15s cubic-bezier(.2,.8,.2,1); }
  .mv-dock-item:hover{ transform:translateY(-5px); }
  .mv-dock-ico{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:19px; background:transparent; border:0; }
  .mv-dock-item.dragging{ opacity:.4; }
  .mv-dock-del{ position:absolute; top:-4px; right:-2px; width:14px; height:14px; border-radius:50%;
    background:#c0392b; color:#fff; font-size:9px; display:none; align-items:center; justify-content:center;
    cursor:pointer; z-index:2; }
  .mv-dock-item{ position:relative; }
  .mv-dock-item:hover .mv-dock-del{ display:flex; }
  .mv-dock-name{ font-size:8px; font-weight:600; color:var(--text-dim); max-width:52px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; opacity:0; transition:opacity .15s; }
  .mv-dock-item:hover .mv-dock-name{ opacity:1; }
  body.mv-locked #mvHint{ display:none; }

  /* 완료(잠금) 모드 — 하나의 고정 화면처럼 */
  body.mv-locked .mvp-head{ display:none; }
  body.mv-locked .mvp-resize{ display:none; }
  body.mv-locked .mvp{ box-shadow:none; border-color:var(--border); }
  body.mv-locked .mvp.active{ box-shadow:none; }
  body.mv-locked #mvAddBtn,
  body.mv-locked #mvHint{ display:none; }
  body.mv-locked #mvLockBtn{ background:var(--accent-warm); color:#fff; border-color:var(--accent-warm); }
</style>
</head>
<body>
<div id="mvFrame">
  <div id="mvCanvasWrap">
    <div id="mvCanvas"></div>

    <div id="mvTop">
      <button class="mv-tbtn" id="mvAddBtn" title="화면 추가">＋</button>
      <button class="mv-tbtn" id="mvLockBtn" title="완료(고정)">✓</button>
      <button class="mv-tbtn" id="mvFsBtn" title="전체화면">⛶</button>
      <button class="mv-tbtn" id="mvSettingsBtn" title="설정">⚙</button>
      <button class="mv-tbtn" id="mvBackBtn" title="뒤로">←</button>
    </div>

    <div id="mvPanel">
      <h4>🖥️ 멀티뷰</h4>
      <label>화면 추가</label>
      <select id="mvAddScreen"></select>
      <button class="mv-btn full" id="mvAddBtn2">＋ 선택한 화면 추가</button>
      <label>하단 독 아이콘</label>
      <select id="mvDockScreen"></select>
      <select id="mvDockStore" style="display:none; margin-top:6px;"></select>
      <button class="mv-btn ghost full" id="mvDockAddBtn">＋ 독에 아이콘 추가</button>
      <label>전체 확대 / 축소</label>
      <div id="mvZoom"><button id="mvZoomOut">−</button><span id="mvZoomVal">100%</span><button id="mvZoomIn">＋</button></div>
      <label>배경 이미지</label>
      <input id="mvBgUrl" placeholder="https://... 이미지 주소" autocomplete="off">
      <div style="display:flex; gap:6px; margin-top:6px;">
        <button class="mv-btn ghost" id="mvBgFileBtn" style="flex:1;">🖼️ 파일 선택</button>
        <button class="mv-btn ghost" id="mvBgClearBtn" style="flex:1;">배경 제거</button>
      </div>
      <input type="file" id="mvBgFile" accept="image/*" style="display:none;">
      <label>레이아웃</label>
      <button class="mv-btn ghost full" id="mvResetBtn">초기화 (모든 패널 삭제)</button>
    </div>

    <div id="mvHint">패널 제목줄을 끌어 이동 · 우하단 모서리를 끌어 크기조절 · 제목줄에서 화면 선택</div>
    <div id="mvDock"></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var $=function(id){ return document.getElementById(id); };

  // 넣을 수 있는 화면 목록
  var SCREENS=[
    { id:'', name:'— 화면 선택 —', url:'' },
    // THE SHAWN 자체 기능 (shawn.html?mv=…)
    { id:'calendar', name:'📅 캘린더(일정표)', url:'shawn.html?mv=calendar' },
    { id:'egmmcal', name:'🗓️ EGMM 캘린더', url:'egmm-calendar.html' },
    { id:'bible', name:'📖 성경찾기', url:'shawn.html?mv=bible' },
    { id:'upc', name:'🏷️ UPC 변환', url:'shawn.html?mv=upc' },
    { id:'case', name:'🔤 대소문자 변환', url:'shawn.html?mv=case' },
    { id:'weight', name:'⚖️ 용량 변환', url:'shawn.html?mv=weight' },
    { id:'calc', name:'🧮 계산기', url:'shawn.html?mv=calc' },
    { id:'claude', name:'📝 작업 지침서', url:'shawn.html?mv=claude' },
    { id:'log', name:'📊 접속 로그', url:'shawn.html?mv=accesslog' },
    // 독립 매니저/도구
    { id:'plumgr', name:'🗂️ PLU MANAGER', url:'plu-list-manager.html' },
    { id:'upcmgr', name:'🏷️ UPC MANAGER', url:'upc-list-manager.html' },
    { id:'store', name:'🏬 STORE MANAGER', url:'store-manager.html' },
    { id:'ad', name:'📢 광고상품 관리', url:'advertising.html' },
    { id:'ocr', name:'🔎 OCR CONVERT', url:'upc-list-convert-ocr.html' },
    { id:'egmm', name:'🅔 EGMM (REQUEST)', url:'egmm.html' },
    { id:'htalk', name:'💬 H-TALK (매장 메시지)', url:'messanger.html' },
    { id:'hmart', name:'🛒 H-MART 매장', url:'hmart.html', store:true },
    { id:'ext', name:'🔗 외부 링크…', url:'', ext:true }
  ];
  var STORES=['TACOMA','FEDERALWAY','BELLEVUE','BALLARD','REDMOND','LYNNWOOD','G-MART','MELLOW WAY','DISTRICT-H','M2M','UNIVERSITY'];

  var state={ panels:[], zoom:1, bg:'', zTop:10, locked:false, dock:[] };
  function load(){ try{ var s=JSON.parse(localStorage.getItem('shawnMvFree')||'null'); if(s) state=Object.assign(state,s); }catch(e){} }
  function save(){ try{ localStorage.setItem('shawnMvFree', JSON.stringify(state)); }catch(e){} }

  function screenById(id){ for(var i=0;i<SCREENS.length;i++){ if(SCREENS[i].id===id) return SCREENS[i]; } return SCREENS[0]; }
  function srcFor(p){
    var sc=screenById(p.screen);
    if(!sc || !sc.id) return '';
    if(sc.ext) return p.url||'';
    if(sc.store) return sc.url+(p.store?('?store='+encodeURIComponent(p.store)):'');
    return sc.url;
  }

  function render(){
    var canvas=$('mvCanvas');
    // 기존 패널 제거 후 다시(간단히 전체 재생성)
    Array.prototype.slice.call(canvas.querySelectorAll('.mvp')).forEach(function(el){ el.parentNode.removeChild(el); });
    state.panels.forEach(function(p, idx){ canvas.appendChild(buildPanel(p, idx)); });
    applyZoom(); applyBg(); renderDock();
  }
  // 아이콘·이름 분리 (name 예: "📅 캘린더(일정표)")
  function splitIcon(name){
    var m=String(name||'').match(/^(\S+)\s+(.*)$/);
    if(m) return { ico:m[1], label:m[2] };
    return { ico:'▫', label:name||'' };
  }
  // 하단 독: state.dock(별도 설정)의 아이콘들
  function renderDock(){
    var dock=$('mvDock'); if(!dock) return;
    var items=state.dock||[];
    dock.innerHTML=items.map(function(it, i){
      var sc=screenById(it.screen); if(!sc||!sc.id) return '';
      var si=splitIcon(sc.name);
      var label=si.label+(it.store?(' · '+it.store):'');
      return '<div class="mv-dock-item" draggable="true" data-i="'+i+'" title="'+esc(label)+'">'
        +(state.locked?'':'<div class="mv-dock-del" title="독에서 제거">✕</div>')
        +'<div class="mv-dock-ico">'+esc(si.ico)+'</div>'
        +'<div class="mv-dock-name">'+esc(label)+'</div></div>';
    }).join('');
    var dragEl=null;
    Array.prototype.forEach.call(dock.querySelectorAll('.mv-dock-item'), function(el){
      var i=parseInt(el.dataset.i,10);
      el.onclick=function(ev){ if(ev.target.classList.contains('mv-dock-del')) return; openFromDock(state.dock[i]); };
      var del=el.querySelector('.mv-dock-del'); if(del) del.onclick=function(ev){ ev.stopPropagation(); state.dock.splice(i,1); renderDock(); save(); };
      el.addEventListener('dragstart', function(){ dragEl=el; el.classList.add('dragging'); });
      el.addEventListener('dragend', function(){ el.classList.remove('dragging'); dragEl=null; });
      el.addEventListener('dragover', function(e){ e.preventDefault(); if(!dragEl||dragEl===el) return;
        var r=el.getBoundingClientRect(); var before=(e.clientX < r.left + r.width/2);
        dock.insertBefore(dragEl, before?el:el.nextSibling); });
      el.addEventListener('drop', function(e){ e.preventDefault(); commitDockOrder(); });
    });
  }
  // 독 DOM 순서 → state.dock 재정렬
  function commitDockOrder(){
    var dock=$('mvDock'); if(!dock) return;
    var order=Array.prototype.map.call(dock.querySelectorAll('.mv-dock-item'), function(el){ return parseInt(el.dataset.i,10); });
    var picked=[]; order.forEach(function(i){ if(state.dock[i]) picked.push(state.dock[i]); });
    if(picked.length===state.dock.length){ state.dock=picked; save(); renderDock(); }
  }
  // 독 아이콘 클릭 → 그 화면 패널이 있으면 포커스, 없으면 새로 추가
  function openFromDock(item){
    if(!item) return;
    var foundIdx=-1;
    state.panels.forEach(function(p,i){ if(p.screen===item.screen && (p.store||'')===(item.store||'')) foundIdx=i; });
    if(foundIdx>=0){ focusPanelByIdx(foundIdx); }
    else { addPanel(item.screen, item.store); }
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  // 독 아이콘 클릭 → 해당 패널 맨 앞으로 + 잠깐 강조
  function focusPanelByIdx(idx){
    var cells=$('mvCanvas').querySelectorAll('.mvp');
    var el=cells[idx]; if(!el) return;
    state.panels.forEach(function(x,i){ x.z=(i===idx?(++state.zTop):x.z); });
    el.style.zIndex=state.panels[idx].z;
    Array.prototype.forEach.call(cells, function(o){ o.classList.remove('active'); });
    el.classList.add('active');
    el.animate([{ transform:'scale(1.0)' },{ transform:'scale(1.02)' },{ transform:'scale(1.0)' }], { duration:260 });
  }

  function buildPanel(p, idx){
    var el=document.createElement('div');
    el.className='mvp'; el.style.left=(p.x||40)+'px'; el.style.top=(p.y||40)+'px';
    el.style.width=(p.w||420)+'px'; el.style.height=(p.h||300)+'px'; el.style.zIndex=(p.z||10);
    var sc=screenById(p.screen);
    el.innerHTML=
      '<div class="mvp-head">'
        +'<span class="tick"></span>'
        +'<select class="mvp-screen">'+SCREENS.map(function(s){ return '<option value="'+s.id+'"'+(s.id===p.screen?' selected':'')+'>'+s.name+'</option>'; }).join('')+'</select>'
        +'<select class="mvp-store" style="display:'+(sc.store?'':'none')+'"><option value="">매장</option>'+STORES.map(function(st){ return '<option value="'+st+'"'+(st===p.store?' selected':'')+'>'+st+'</option>'; }).join('')+'</select>'
        +'<input class="mvp-ext" style="display:'+(sc.ext?'':'none')+'" placeholder="https://..." value="'+(p.url||'').replace(/"/g,'&quot;')+'">'
        +'<button class="mvp-reload" title="새로고침">↻</button>'
        +'<button class="mvp-close" title="닫기">✕</button>'
      +'</div>'
      +'<div class="mvp-body"></div>'
      +'<div class="mvp-resize"></div>';
    wirePanel(el, p, idx);
    fillBody(el, p);
    return el;
  }

  function setIframeScroll(ifr){
    var edit=!state.locked;
    try{
      var d=ifr.contentDocument; if(d){
        d.documentElement.style.overflow = edit?'auto':'hidden';
        if(d.body) d.body.style.overflow = edit?'auto':'hidden';
        var sid='__mvScrollStyle', ex=d.getElementById(sid);
        if(!ex){ ex=d.createElement('style'); ex.id=sid; (d.head||d.documentElement).appendChild(ex); }
        if(edit){
          // 편집: 스크롤바 항상 보이게(맥 포함)
          ex.textContent='::-webkit-scrollbar{width:12px;height:12px;-webkit-appearance:none;}'
            +'::-webkit-scrollbar-thumb{background:rgba(0,0,0,.38);border-radius:6px;border:2px solid rgba(255,255,255,.7);}'
            +'::-webkit-scrollbar-track{background:rgba(0,0,0,.06);}'
            +'html{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.38) rgba(0,0,0,.06);}';
        } else {
          // 고정: 스크롤바 완전 숨김(내부 스크롤 영역 포함)
          ex.textContent='*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;}'
            +'*{scrollbar-width:none!important;-ms-overflow-style:none!important;}';
        }
      }
    }catch(e){}
    ifr.setAttribute('scrolling', state.locked?'no':'yes');
  }
  function fillBody(el, p){
    var body=el.querySelector('.mvp-body');
    var src=srcFor(p);
    if(src){
      body.innerHTML='<iframe src="'+src.replace(/"/g,'&quot;')+'" scrolling="'+(state.locked?'no':'yes')+'" allow="clipboard-read; clipboard-write; microphone; camera"></iframe>';
      var ifr=body.querySelector('iframe');
      ifr.addEventListener('load', function(){ setIframeScroll(ifr); });
    }
    else { body.innerHTML='<div class="mvp-empty"><span style="font-size:24px;">＋</span><span>제목줄에서 화면을 선택하세요</span></div>'; }
  }
  // 모든 패널 iframe 스크롤 상태 갱신
  function refreshAllScroll(){
    Array.prototype.forEach.call(document.querySelectorAll('.mvp-body iframe'), function(ifr){ setIframeScroll(ifr); });
  }

  // 자석(스냅): 다른 패널의 모서리·크기에 맞춤
  var SNAP=9;
  function snapTargets(exceptEl){
    var xs=[0], ys=[0], ws=[], hs=[];
    var canvas=$('mvCanvas');
    xs.push(canvas.clientWidth); ys.push(canvas.clientHeight);
    Array.prototype.forEach.call(canvas.querySelectorAll('.mvp'), function(o){
      if(o===exceptEl) return;
      var l=o.offsetLeft, t=o.offsetTop, w=o.offsetWidth, h=o.offsetHeight;
      xs.push(l, l+w); ys.push(t, t+h); ws.push(w); hs.push(h);
    });
    return { xs:xs, ys:ys, ws:ws, hs:hs };
  }
  function snap1(v, cands){ for(var i=0;i<cands.length;i++){ if(Math.abs(v-cands[i])<SNAP) return cands[i]; } return v; }

  function wirePanel(el, p, idx){
    var head=el.querySelector('.mvp-head');
    var screenSel=el.querySelector('.mvp-screen'), storeSel=el.querySelector('.mvp-store'), extInp=el.querySelector('.mvp-ext');
    var body=el.querySelector('.mvp-body');

    function focus(){ state.panels.forEach(function(x){ x.z=(x===p?(++state.zTop):x.z); }); el.style.zIndex=p.z; Array.prototype.slice.call($('mvCanvas').querySelectorAll('.mvp')).forEach(function(o){ o.classList.remove('active'); }); el.classList.add('active'); }
    el.addEventListener('mousedown', focus, true);

    function syncControls(){
      var sc=screenById(screenSel.value);
      storeSel.style.display=sc.store?'':'none';
      extInp.style.display=sc.ext?'':'none';
    }
    screenSel.onchange=function(){ p.screen=screenSel.value; syncControls(); fillBody(el, p); save(); };
    storeSel.onchange=function(){ p.store=storeSel.value; fillBody(el, p); save(); };
    extInp.onchange=function(){ p.url=extInp.value; fillBody(el, p); save(); };
    el.querySelector('.mvp-reload').onclick=function(){ fillBody(el, p); };
    el.querySelector('.mvp-close').onclick=function(){ var i=state.panels.indexOf(p); if(i>=0) state.panels.splice(i,1); el.parentNode.removeChild(el); save(); render(); };

    // 이동(제목줄 드래그) — 셀렉트/버튼 클릭은 제외
    head.addEventListener('mousedown', function(e){
      if(state.locked) return;
      if(e.target.closest('select')||e.target.closest('button')||e.target.closest('input')) return;
      e.preventDefault(); focus();
      var sx=e.clientX, sy=e.clientY, ox=parseFloat(el.style.left), oy=parseFloat(el.style.top);
      var w=el.offsetWidth, h=el.offsetHeight;
      body.classList.add('drag-lock');
      function mm(ev){
        var nx=ox+(ev.clientX-sx)/state.zoom, ny=oy+(ev.clientY-sy)/state.zoom;
        var t=snapTargets(el);
        // 왼쪽/오른쪽 모서리 스냅
        var sl=snap1(nx, t.xs); if(sl!==nx){ nx=sl; } else { var sr=snap1(nx+w, t.xs); if(sr!==nx+w) nx=sr-w; }
        // 위/아래 모서리 스냅
        var st=snap1(ny, t.ys); if(st!==ny){ ny=st; } else { var sb=snap1(ny+h, t.ys); if(sb!==ny+h) ny=sb-h; }
        el.style.left=nx+'px'; el.style.top=ny+'px';
      }
      function mu(){ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); body.classList.remove('drag-lock'); p.x=parseFloat(el.style.left); p.y=parseFloat(el.style.top); save(); }
      document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
    });

    // 크기조절(우하단)
    el.querySelector('.mvp-resize').addEventListener('mousedown', function(e){
      if(state.locked) return;
      e.preventDefault(); e.stopPropagation(); focus();
      var sx=e.clientX, sy=e.clientY, ow=el.offsetWidth, oh=el.offsetHeight;
      body.classList.add('drag-lock');
      function mm(ev){
        var nw=Math.max(180, ow+(ev.clientX-sx)/state.zoom), nh=Math.max(120, oh+(ev.clientY-sy)/state.zoom);
        var left=el.offsetLeft, top=el.offsetTop;
        var t=snapTargets(el);
        // 오른쪽 모서리(left+nw)를 다른 세로선에 스냅 → 폭 일치
        var sr=snap1(left+nw, t.xs); if(sr!==left+nw){ nw=sr-left; } else { var sw=snap1(nw, t.ws); if(sw!==nw) nw=sw; }
        // 아래 모서리(top+nh)를 다른 가로선에 스냅 → 세로길이 일치
        var sb=snap1(top+nh, t.ys); if(sb!==top+nh){ nh=sb-top; } else { var sh=snap1(nh, t.hs); if(sh!==nh) nh=sh; }
        el.style.width=Math.max(180,nw)+'px'; el.style.height=Math.max(120,nh)+'px';
      }
      function mu(){ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); body.classList.remove('drag-lock'); p.w=el.offsetWidth; p.h=el.offsetHeight; save(); }
      document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
    });
  }

  function addPanel(screenId, storeVal){
    var n=state.panels.length;
    var p={ screen:screenId||'', store:storeVal||'', url:'', x:40+(n%5)*34, y:40+(n%5)*34, w:440, h:320, z:(++state.zTop) };
    state.panels.push(p);
    $('mvCanvas').appendChild(buildPanel(p, n));
    save();
  }

  function applyZoom(){ var c=$('mvCanvas'); c.style.transformOrigin='top left'; c.style.transform='scale('+state.zoom+')'; $('mvZoomVal').textContent=Math.round(state.zoom*100)+'%'; }
  function applyBg(){ $('mvCanvas').style.backgroundImage=state.bg?('url("'+state.bg.replace(/"/g,'')+'")'):''; }
  // 배경 파일 → 리사이즈/압축 후 dataURL (localStorage 용량 절약)
  function bgFromFile(file){
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var maxW=1920, scale=Math.min(1, maxW/img.width);
        var cv=document.createElement('canvas'); cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        var data=cv.toDataURL('image/jpeg', 0.82);
        state.bg=data; applyBg();
        try{ save(); }catch(e){ alert('배경 이미지가 너무 커서 저장하지 못했습니다. 더 작은 이미지를 사용하세요.'); }
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function applyLock(){
    document.body.classList.toggle('mv-locked', !!state.locked);
    var b=$('mvLockBtn'); if(b){ b.textContent=state.locked?'✎':'✓'; b.title=state.locked?'편집':'완료(고정)'; }
    // 잠금 시 열린 설정 패널 닫기
    if(state.locked){ $('mvPanel').classList.remove('show'); }
    refreshAllScroll();   // 편집=스크롤 표시 / 고정=스크롤 숨김
  }
  function toggleFullscreen(){
    var d=document, el=d.documentElement;
    var isFs = d.fullscreenElement || d.webkitFullscreenElement || d.mozFullScreenElement || d.msFullscreenElement;
    if(!isFs){
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if(req) req.call(el);
    } else {
      var exit = d.exitFullscreen || d.webkitExitFullscreen || d.mozCancelFullScreen || d.msExitFullscreen;
      if(exit) exit.call(d);
    }
  }
  function onFsChange(){
    var d=document;
    var isFs = d.fullscreenElement || d.webkitFullscreenElement || d.mozFullScreenElement || d.msFullscreenElement;
    var b=$('mvFsBtn'); if(b){ b.textContent=isFs?'🗗':'⛶'; b.title=isFs?'전체화면 해제':'전체화면'; }
  }
  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(function(ev){ document.addEventListener(ev, onFsChange); });

  function bindControls(){
    // 설정 패널 화면 선택 드롭다운 채우기
    var addSel=$('mvAddScreen');
    if(addSel){ addSel.innerHTML=SCREENS.filter(function(s){ return s.id; }).map(function(s){ return '<option value="'+s.id+'">'+s.name+'</option>'; }).join(''); }
    $('mvAddBtn').onclick=function(){ addPanel(); };
    $('mvAddBtn2').onclick=function(){ addPanel(addSel?addSel.value:''); };
    // 독 아이콘 관리
    var dockSel=$('mvDockScreen'), dockStore=$('mvDockStore');
    if(dockSel){ dockSel.innerHTML=SCREENS.filter(function(s){ return s.id; }).map(function(s){ return '<option value="'+s.id+'">'+s.name+'</option>'; }).join('');
      dockSel.onchange=function(){ var sc=screenById(dockSel.value); dockStore.style.display=sc.store?'':'none'; };
    }
    if(dockStore){ dockStore.innerHTML='<option value="">매장 선택</option>'+STORES.map(function(st){ return '<option value="'+st+'">'+st+'</option>'; }).join(''); }
    var dockAdd=$('mvDockAddBtn'); if(dockAdd) dockAdd.onclick=function(){
      var sc=screenById(dockSel.value); if(!sc||!sc.id) return;
      var store=(sc.store&&dockStore.value)?dockStore.value:'';
      state.dock.push({ screen:sc.id, store:store }); renderDock(); save();
    };
    $('mvLockBtn').onclick=function(){ state.locked=!state.locked; applyLock(); save(); };
    $('mvFsBtn').onclick=toggleFullscreen;
    $('mvSettingsBtn').onclick=function(){ if(state.locked) return; $('mvPanel').classList.toggle('show'); };
    $('mvBackBtn').onclick=function(){ location.href='shawn.html'; };
    $('mvZoomIn').onclick=function(){ state.zoom=Math.min(2, state.zoom+0.1); applyZoom(); save(); };
    $('mvZoomOut').onclick=function(){ state.zoom=Math.max(0.4, state.zoom-0.1); applyZoom(); save(); };
    $('mvBgUrl').onchange=function(){ state.bg=this.value.trim(); applyBg(); save(); };
    var bgFileBtn=$('mvBgFileBtn'); if(bgFileBtn) bgFileBtn.onclick=function(){ $('mvBgFile').click(); };
    var bgFile=$('mvBgFile'); if(bgFile) bgFile.onchange=function(e){ var f=e.target.files&&e.target.files[0]; if(f) bgFromFile(f); e.target.value=''; };
    var bgClear=$('mvBgClearBtn'); if(bgClear) bgClear.onclick=function(){ state.bg=''; $('mvBgUrl').value=''; applyBg(); save(); };
    $('mvResetBtn').onclick=function(){ if(!confirm('모든 패널을 삭제할까요?')) return; state.panels=[]; render(); save(); };
  }

  // 시작
  load();
  bindControls();
  $('mvBgUrl').value=state.bg||'';
  if(!state.panels.length){ addPanel(); } else { render(); }
  applyLock();
})();
</script>
