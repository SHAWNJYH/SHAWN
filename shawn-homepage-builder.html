};
function openStarters(){openModal('스타터로 시작','<p>선택하면 현재 프로젝트를 대체합니다.</p><div class="tpl-grid">'+
  Object.entries(STARTERS).map(([k,t])=>`<div class="tpl-card" data-s="${k}"><div class="t">${t.name}</div><div class="d">${t.desc}</div></div>`).join('')+'</div>');
  $$('#modalBody .tpl-card').forEach(c=>c.addEventListener('click',()=>{project=STARTERS[c.dataset.s].build();ensureCur();state.sel=null;snapshot();renderAll();closeModal();toast(STARTERS[c.dataset.s].name+' 적용');}));}

/* ---- design (theme) menu: color + font ---- */
const PALETTES={
  '딥 네이비':{bg:'#0b1424',ink:'#e8effb',muted:'#a9bcd8',accent:'#3d7bf0'},
  '미드나잇':{bg:'#0a0f1e',ink:'#eef1fb',muted:'#9aa6c4',accent:'#7c8cff'},
  '차콜':{bg:'#141618',ink:'#f0f2f4',muted:'#aab0b8',accent:'#e0654f'},
  '포레스트':{bg:'#0c1a14',ink:'#eaf5ee',muted:'#9ec2ae',accent:'#3fbf7f'},
  '와인':{bg:'#1a0e14',ink:'#f7ecef',muted:'#c9a3ae',accent:'#c95a7a'},
  '라이트':{bg:'#f5f7fb',ink:'#101a2e',muted:'#4a5a72',accent:'#3d7bf0'},
};
function applyThemeColors(recolor){const t=project.theme;
  project.pages.forEach(pg=>{pg.bg=t.bg;if(recolor)pg.blocks.forEach(b=>{
    if(b.type==='heading'&&!b.props.asImage)b.props.color=t.ink;
    else if(b.type==='text')b.props.color=t.muted;
    else if(b.type==='button')b.props.color=t.accent;
    else if(b.type==='nav')b.props.color=t.ink;});});
  renderAll();}
function themeSwatch(k){const p=PALETTES[k];return`<button class="tpl-card" data-pal="${k}" style="display:flex;align-items:center;gap:12px">
  <span style="display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line2);flex-shrink:0">
    <span style="width:22px;height:34px;background:${p.bg}"></span><span style="width:22px;height:34px;background:${p.accent}"></span><span style="width:22px;height:34px;background:${p.ink}"></span></span>
  <span class="t" style="margin:0">${k}</span></button>`;}
function openThemeMenu(){const t=project.theme;
  const cRow=(l,k)=>`<div class="field"><label>${l}</label><div class="color-row"><input type="color" data-tc="${k}" value="${(t[k]||'#000000').slice(0,7)}"><input type="text" data-tc="${k}" value="${esc(t[k])}" style="flex:1"></div></div>`;
  openModal('🎨 디자인 (화면 색상 · 글씨체)',
    `<p>팔레트를 고르면 전체 페이지 배경과 글자색이 한 번에 바뀝니다.</p>
    <div class="tpl-grid" id="palGrid">${Object.keys(PALETTES).map(themeSwatch).join('')}</div>
    <div class="divider-line"></div>
    <div class="insp-title" style="font-size:13px;margin-bottom:12px">개별 색상</div>
    <div class="row2">${cRow('배경','bg')}${cRow('강조','accent')}</div>
    <div class="row2">${cRow('기본 글자','ink')}${cRow('보조 글자','muted')}</div>
    <div class="divider-line"></div>
    <div class="insp-title" style="font-size:13px;margin-bottom:12px">글씨체 (전체)</div>
    <div class="field"><select id="themeFont">${Object.entries(FONTS).map(([k,v])=>`<option value="${k}" ${t.font===k?'selected':''} style="font-family:${v.stack}">${v.label}</option>`).join('')}</select></div>
    <p style="font-size:12px;color:var(--faint);margin:0">색을 바꾸면 제목·본문·버튼 색도 함께 맞춰집니다. 개별 블록에서 다시 세부 조정할 수 있어요.</p>`,
    `<button class="tb-btn" id="themeDone">완료</button>`);
  $$('#palGrid .tpl-card').forEach(c=>c.addEventListener('click',()=>{Object.assign(project.theme,PALETTES[c.dataset.pal]);applyThemeColors(true);openThemeMenu();toast(c.dataset.pal+' 팔레트 적용');}));
  $$('#modalBody [data-tc]').forEach(inp=>{const k=inp.dataset.tc;
    const ev=inp.type==='color'?'input':'change';
    inp.addEventListener(ev,()=>{project.theme[k]=inp.value;$$(`#modalBody [data-tc="${k}"]`).forEach(o=>{if(o!==inp)o.value=inp.value;});applyThemeColors(true);});});
  $('#themeFont').addEventListener('change',e=>{project.theme.font=e.target.value;renderAll();toast('글씨체 변경됨');});
  $('#themeDone').addEventListener('click',()=>{snapshot();closeModal();});}

/* ---- wiring ---- */
function setDevice(d){state.device=d;const fr=$('#frame'),st=$('#stage');fr.classList.remove('tablet','mobile');st.classList.remove('split');
  $('#mirrorWrap').classList.add('hidden');
  if(d==='split'){st.classList.add('split');$('#mirrorWrap').classList.remove('hidden');syncMirror();}
  else if(d!=='desktop')fr.classList.add(d);
  $$('#deviceToggle button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));}
$('#deviceToggle').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setDevice(b.dataset.d);});
$('#langToggle').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.lang=b.dataset.l;
  $$('#langToggle button').forEach(x=>x.classList.toggle('on',x.dataset.l===state.lang));renderAll();toast(state.lang==='ko'?'한글 편집':'English editing');});
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#exportBtn').onclick=exportSite;$('#saveBtn').onclick=saveProject;
$('#loadBtn').onclick=()=>$('#fileInput').click();
$('#fileInput').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value='';});
$('#tplBtn').onclick=openStarters;$('#addPage').onclick=addPage;$('#themeBtn').onclick=openThemeMenu;
$('#modalClose').onclick=closeModal;$('#modalBg').addEventListener('click',e=>{if(e.target===$('#modalBg'))closeModal();});
$('#roleSel').addEventListener('change',e=>{state.role=e.target.value;applyRolePreview();});
$('#previewBtn').onclick=()=>{document.body.classList.replace('editing','preview');state.sel=null;renderCanvas();$('#exitPreview').style.display='block';};
$('#exitPreview').onclick=()=>{document.body.classList.replace('preview','editing');state.role='게스트';$('#roleSel').value='게스트';renderCanvas();$('#exitPreview').style.display='none';};
$('#stage').addEventListener('mousedown',e=>{if(e.target===$('#stage')||e.target===$('#frame')){state.sel=null;selOnly();}});
document.addEventListener('keydown',e=>{const ae=document.activeElement;
  if(ae&&(['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)||ae.isContentEditable))return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
  else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();redo();}
  else if((e.key==='Delete'||e.key==='Backspace')&&state.sel){e.preventDefault();delBlock(state.sel);}
  else if(e.key==='Escape'){$('#modalBg').classList.contains('show')?closeModal():(state.sel=null,selOnly());}});

buildPalette();project=starterSite();ensureCur();snapshot();renderAll();setDevice('desktop');
</script>
