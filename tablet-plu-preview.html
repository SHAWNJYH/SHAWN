  }
  // 자모 입력을 받아 searchQuery 갱신 (완성 글자는 확정, 진행 중 글자는 마지막에)
  var committed='';  // 확정된 문자열
  // 복합 모음(ㅗ+ㅏ=ㅘ) · 복합 받침(ㄱ+ㅅ=ㄳ) 결합/분해표
  var JUNG_COMBO={ 'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ' };
  var JUNG_SPLIT={ 'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ'] };
  var JONG_COMBO={ 'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ' };
  var JONG_SPLIT={ 'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ'] };

  function feedJamo(jamo){
    if(isJung(jamo)){
      if(hangul.cho<0){ committed+=jamo; return; }              // 모음 단독
      if(hangul.jung<0){ hangul.jung=JUNG_L.indexOf(jamo); return; }
      if(hangul.jong<0){
        // 중성만 있는 상태 → 복합 모음 결합 (고 + ㅏ = 과)
        var comb=JUNG_COMBO[JUNG_L[hangul.jung]+jamo];
        if(comb){ hangul.jung=JUNG_L.indexOf(comb); return; }
        committed+=composeHangul(); resetHangul(); committed+=jamo; return;
      }
      // 받침이 있는 상태에서 모음 → 받침을 다음 글자의 초성으로 넘김 (삭 + ㅗ = 사고)
      var jc=JONG_L[hangul.jong], moveCho=jc, keep=-1;
      if(JONG_SPLIT[jc]){ keep=JONG_L.indexOf(JONG_SPLIT[jc][0]); moveCho=JONG_SPLIT[jc][1]; }
      hangul.jong=keep;
      committed+=composeHangul(); resetHangul();
      hangul.cho=CHO_L.indexOf(moveCho); hangul.jung=JUNG_L.indexOf(jamo);
      return;
    }
    if(!isCho(jamo)) return;
    if(hangul.cho<0){ hangul.cho=CHO_L.indexOf(jamo); return; }
    if(hangul.jung<0){ committed+=composeHangul(); resetHangul(); hangul.cho=CHO_L.indexOf(jamo); return; }
    if(hangul.jong<0){
      var ji=JONG_L.indexOf(jamo);
      if(ji>0) hangul.jong=ji;
      else { committed+=composeHangul(); resetHangul(); hangul.cho=CHO_L.indexOf(jamo); }
      return;
    }
    // 받침이 이미 있으면 복합 받침 결합 시도 (갑 + ㅅ = 값)
    var cc=JONG_COMBO[JONG_L[hangul.jong]+jamo];
    if(cc){ hangul.jong=JONG_L.indexOf(cc); return; }
    committed+=composeHangul(); resetHangul(); hangul.cho=CHO_L.indexOf(jamo);
  }
  function currentText(){
    // committed(확정) + 진행 중 한글 조합 (KO 모드에서만 조합 진행)
    return committed + composeHangul();
  }
  function commitPending(){ // 진행 중 한글을 확정
    if(hangul.cho>=0){ committed+=composeHangul(); resetHangul(); }
  }
  function pressKey(k){
    if(!searching) openSearch();
    // 키 종류 자동 판별: 한글 자모면 조합, 영문 등은 그대로
    if(isCho(k) || isJung(k)){ feedJamo(k); }
    else { commitPending(); committed+=k; }
    updateSearch();
  }
  function pressSpace(){
    commitPending(); committed+=' ';
    updateSearch();
  }
  // 이미 확정된 마지막 글자를 다시 조합 상태로 되돌린다 (사 → ㅅ+ㅏ)
  function decomposeLast(){
    if(!committed) return false;
    var code=committed.charCodeAt(committed.length-1);
    if(code<0xAC00 || code>0xD7A3) return false;
    var idx=code-0xAC00, jo=idx%28;
    hangul.cho=Math.floor(idx/588);
    hangul.jung=Math.floor((idx%588)/28);
    hangul.jong=jo?jo:-1;
    committed=committed.slice(0,-1);
    return true;
  }
  function pressDel(){
    if(hangul.cho<0) decomposeLast();   // 확정 글자도 자모 단위로 지운다
    if(hangul.cho>=0){
      if(hangul.jong>=0){
        // 복합 받침이면 앞 자음만 남김 (값 → 갑), 아니면 받침 제거
        var jc=JONG_L[hangul.jong];
        hangul.jong = JONG_SPLIT[jc] ? JONG_L.indexOf(JONG_SPLIT[jc][0]) : -1;
      }
      else if(hangul.jung>=0){
        // 복합 모음이면 앞 모음만 남김 (과 → 고), 아니면 초성만 남김 (고 → ㄱ)
        var vc=JUNG_L[hangul.jung];
        hangul.jung = JUNG_SPLIT[vc] ? JUNG_L.indexOf(JUNG_SPLIT[vc][0]) : -1;
      }
      else { hangul.cho=-1; }
    } else if(committed){ committed=committed.slice(0,-1); }
    updateSearch();
  }
  function pressClear(){ committed=''; resetHangul(); updateSearch(); }
  function pressNum(n){
    if(!searching) openSearch();
    commitPending(); committed+=n;
    updateSearch();
  }

  function onKbdClick(e){
    // 왼쪽 모드 버튼 (한글/영문/숫자)
    var mb=e.target.closest('.kbd-mode');
    if(mb){
      var m=mb.getAttribute('data-mode');
      commitPending();
      if(m==='TOGGLE'){
        // 이미 한/영 키패드면 반대 언어로, 아니면 마지막에 쓰던 언어로
        if(kbdMode==='KO'||kbdMode==='EN') kbdLang = (kbdMode==='KO') ? 'EN' : 'KO';
        kbdMode = kbdLang;
      } else {
        if(kbdMode===m) return;                     // 이미 선택된 키보드
        kbdMode=m;
      }
      kbdShift=false;
      renderKeyboard();
      return;
    }
    var b=e.target.closest('.kbd-key'); if(!b) return;
    var act=b.getAttribute('data-act');
    if(act==='shift'){ kbdShift=!kbdShift; renderKeyboard(); return; }
    if(act==='none'){ return; }
    if(act==='back'){ if($('backBox')) $('backBox').click(); return; }
    if(act==='del'){ pressDel(); return; }
    if(act==='space'){ pressSpace(); return; }
    if(act==='clear'){ pressClear(); return; }
    var k=b.getAttribute('data-k'); if(k==null) return;
    if(/^[0-9]$/.test(k)) pressNum(k); else pressKey(k);
    if(kbdShift){ kbdShift=false; renderKeyboard(); }   // 한 글자 입력 후 SHIFT 해제
  }
  // 키패드 + (세로 전용) 버튼 바 둘 다 같은 핸들러 사용
  $('kbdBar').addEventListener('click', onKbdClick);
  if($('kbdToolbar')) $('kbdToolbar').addEventListener('click', onKbdClick);

  function openSearch(){
    searching=true; document.body.classList.add('searching'); $('searchOv').classList.add('show');
    positionSearchCard();
    updateBackBtn();   // BACK → 검색취소 로 변경
  }
  // 검색 팝업을 카테고리 리스트 영역에 맞춰 배치
  function positionSearchCard(){
    var lp=$('listPane'); var card=document.querySelector('.search-card'); if(!lp||!card) return;
    var r=lp.getBoundingClientRect();
    card.style.left=r.left+'px'; card.style.top=r.top+'px';
    card.style.width=r.width+'px'; card.style.height=r.height+'px';
  }
  // 화면 회전·크기 변경 시 열려 있는 검색 팝업 위치 재계산
  window.addEventListener('resize', function(){ if(searching) positionSearchCard(); });
  function closeSearch(){
    searching=false; document.body.classList.remove('searching'); $('searchOv').classList.remove('show');
    committed=''; resetHangul();
    $('searchQ').innerHTML=''; $('searchResults').innerHTML='';
    updateBackBtn();
  }
  function updateSearch(){
    var q=currentText();
    $('searchQ').innerHTML=esc(q)+'<span class="caret">|</span>';
    var rows=searchRows(q);
    if(!q){ $('searchResults').innerHTML='<div class="search-empty">글자를 입력하면 상품을 찾습니다</div>'; return; }
    if(!rows.length){ $('searchResults').innerHTML='<div class="search-empty">"'+esc(q)+'" 검색 결과가 없습니다</div>'; return; }
    var html='';
    rows.slice(0,40).forEach(function(r){
      // 선택 언어가 주(主) = 굵게 / 나머지는 보조. 언어가 달라도 크기는 항상 같다.
      var plu=pluOf(r), nm=itemName(korOf(r), engOf(r));
      html+='<div class="search-item" data-plu="'+esc(plu)+'">'+
        '<span class="snum">'+esc(plu)+'</span>'+
        (nm.main?'<span class="sen">'+esc(nm.main)+'</span>':'')+
        (nm.sub ?'<span class="sko">'+esc(nm.sub)+'</span>':'')+
        '</div>';
    });
    $('searchResults').innerHTML=html;
  }
  // 검색결과는 클릭 대상이 아님 (번호·목록이 나온 시점에 찾기 완료)
  //  → 혹시 발생하는 클릭·터치는 모두 무시하고 팝업을 유지한다
  ['click','pointerdown','touchstart'].forEach(function(ev){
    $('searchResults').addEventListener(ev, function(e){
      if(e.target.closest('.search-item')){ e.preventDefault(); e.stopPropagation(); }
    }, true);
  });
  $('searchClose').addEventListener('click', closeSearch);
  $('searchOv').addEventListener('click', function(e){ if(e.target===$('searchOv')) closeSearch(); });

  /* ===== 매장 표시 + 진입 모드 초기화 ===== */
  // 상단에 매장명 표시 (매장별 화면임을 명확히)
  /* (요구 12) 매장명 표시 제거 */

  if(URL_MODE==='manager'){
    // hmart 안에서 열림 → 관리 모드 (매장별 관리 화면)
    document.title='PLU PREVIEW MANAGER · '+(STORE||'');
    enter(true);
  } else {
    // 메인 진입 → 무조건 캐시어 모드 (관리자 선택 없음)
    enter(false);
  }
})();
</script>
<script>
/* === 매장 PIN 진입 게이트 === 매장 선택 + PIN (plu-store-pins) 통과 전 화면 잠금 · 자동 로그인 없음 */
(function(){
  'use strict';
  var FALLBACK=['TACOMA','FEDERALWAY','BELLEVUE','BALLARD','REDMOND','LYNNWOOD','G-MART','MELLOW WAY','DISTRICT-H','M2M','UNIVERSITY'];
  var VALID=null,_vp=null;
  function fbReady(cb){ if(window.ppFb) cb(); else window.addEventListener('fb-ready', cb, {once:true}); }
  function getDocData(col,id){
    return new Promise(function(res,rej){
      fbReady(function(){ var F=window.ppFb;
        F.getDoc(F.doc(F.db,col,id)).then(function(sn){ res((sn&&sn.exists&&sn.exists())?(sn.data()||{}):null); }).catch(rej);
      });
    });
  }
  function loadStores(){
    if(VALID) return Promise.resolve(VALID);
    if(_vp) return _vp;
    var to=new Promise(function(r){ setTimeout(function(){ r('__t__'); },6000); });
    var fp=getDocData('app-config','stores').then(function(d){
      var l=(d&&Array.isArray(d.list))?d.list.map(function(x){return String((x&&x.name)||x||'').trim().toUpperCase();}).filter(Boolean):[];
      return l.length?l:FALLBACK.slice();
    }).catch(function(){ return FALLBACK.slice(); });
    _vp=Promise.race([fp,to]).then(function(r){
      if(r==='__t__'){ fp.then(function(real){ VALID=real; fill(); }); VALID=FALLBACK.slice(); }
      else VALID=r;
      fill(); return VALID;
    });
    return _vp;
  }
  function fill(){
    var sel=document.getElementById('ppgStore'); if(!sel||!VALID) return;
    var cur=sel.value || (function(){ try{ return localStorage.getItem('theShawnStore')||''; }catch(e){ return ''; } })();
    sel.innerHTML='<option value="">SELECT STORE</option>'+VALID.map(function(n){ return '<option value="'+n.replace(/"/g,'&quot;')+'">'+n+'</option>'; }).join('');
    if(cur && VALID.indexOf(String(cur).toUpperCase())>=0) sel.value=String(cur).toUpperCase();
  }
  function unlock(){ var o=document.getElementById('ppGateOv'); if(o) o.remove(); document.documentElement.classList.remove('pp-gate-lock'); }
  function show(msg){
    document.documentElement.classList.add('pp-gate-lock');
    var o=document.getElementById('ppGateOv');
    if(!o){
      o=document.createElement('div'); o.id='ppGateOv';
      var pad='';
      ['1','2','3','4','5','6','7','8','9'].forEach(function(n){ pad+='<button class="ppg-key" type="button" data-k="'+n+'">'+n+'</button>'; });
      pad+='<button class="ppg-key fn" type="button" data-k="clear">CLEAR</button>'
         + '<button class="ppg-key" type="button" data-k="0">0</button>'
         + '<button class="ppg-key fn del" type="button" data-k="back">← DEL</button>';
      o.innerHTML='<div class="ppg-card">'
        +'<h1 class="ppg-title">PLU PREVIEW</h1>'
        +'<div class="ppg-field"><label>STORE</label><select id="ppgStore"><option value="">LOADING…</option></select></div>'
        +'<div class="ppg-field"><label>PIN</label>'
          +'<div class="ppg-pin" id="ppgPin"><span class="ph" id="ppgPh">ENTER PIN</span><span id="ppgDots"></span></div>'
          +'<div class="ppg-pad" id="ppgPad">'+pad+'</div>'
        +'</div>'
        +'<div class="ppg-err" id="ppgErr"></div>'
        +'<div class="ppg-btns"><button class="ppg-btn" id="ppgEnter" type="button">ENTER</button>'
        +'<button class="ppg-btn ppg-cancel" id="ppgCancel" type="button">CANCEL</button></div>'
      +'</div>';
      (document.body||document.documentElement).appendChild(o);
      fill(); loadStores();
      document.getElementById('ppgEnter').onclick=submit;
      document.getElementById('ppgCancel').onclick=function(){ location.replace('index.html'); };
      // 자체 키패드 — 아이패드 기본 키보드가 뜨지 않고, 로그인 카드 안에서만 동작
      document.getElementById('ppgPad').addEventListener('click', function(e){
        var b=e.target.closest('.ppg-key'); if(!b) return;
        var k=b.getAttribute('data-k');
        if(k==='clear') PIN='';
        else if(k==='back') PIN=PIN.slice(0,-1);
        else if(PIN.length<12) PIN+=k;
        var er=document.getElementById('ppgErr'); if(er) er.textContent='';
        renderPin();
      });
      // 물리 키보드(있을 경우)도 지원
      document.addEventListener('keydown', function(e){
        if(!document.getElementById('ppGateOv')) return;
        if(/^[0-9]$/.test(e.key)){ if(PIN.length<12) PIN+=e.key; renderPin(); e.preventDefault(); }
        else if(e.key==='Backspace'){ PIN=PIN.slice(0,-1); renderPin(); e.preventDefault(); }
        else if(e.key==='Enter'){ submit(); e.preventDefault(); }
      });
      renderPin();
    }
    var er=document.getElementById('ppgErr'); if(er) er.textContent=msg||'';
  }
  var PIN='';
  function renderPin(){
    var d=document.getElementById('ppgDots'), ph=document.getElementById('ppgPh'), box=document.getElementById('ppgPin');
    if(!d) return;
    d.textContent='●'.repeat(PIN.length);
    if(ph) ph.style.display=PIN.length?'none':'';
    if(box) box.classList.toggle('on', PIN.length>0);
  }
  var busy=false;
  function submit(){
    if(busy) return;
    var st=(document.getElementById('ppgStore').value||'').trim().toUpperCase();
    var pin=PIN.trim();
    var er=document.getElementById('ppgErr');
    if(er) er.textContent='';
    if(!st){ if(er) er.textContent='SELECT STORE'; return; }
    if(!pin){ if(er) er.textContent='ENTER PIN'; return; }
    busy=true; if(er) er.textContent='CHECKING…';
    getDocData('plu-store-pins', st).then(function(d){
      busy=false;
      if(!d || d.pin==null){ if(er) er.textContent='PIN NOT SET · ASK MANAGER'; return; }
      if(String(d.pin)!==String(pin)){ if(er) er.textContent='WRONG PIN'; PIN=''; renderPin(); return; }
      try{ localStorage.setItem('theShawnStore', st); }catch(e){}
      try{ sessionStorage.setItem('ppGate','1'); }catch(e){}
      unlock();
    }).catch(function(){ busy=false; if(er) er.textContent='CONNECTION ERROR — TRY AGAIN'; });
  }
  document.documentElement.classList.add('pp-gate-lock');
  document.addEventListener('DOMContentLoaded', function(){
    /* H-MART에서 이미 로그인한 세션(iframe 포함)이면 PIN 없이 바로 입장 */
    var hm=false; try{ hm = sessionStorage.getItem('hmartGate')==='1'; }catch(e){}
    if(hm){
      try{ var q=new URLSearchParams(location.search).get('store'); if(q) localStorage.setItem('theShawnStore', String(q).toUpperCase()); }catch(e){}
      try{ if(!localStorage.getItem('theShawnStore')) localStorage.setItem('theShawnStore','TACOMA'); }catch(e){}
      try{ sessionStorage.setItem('ppGate','1'); }catch(e){}
      unlock(); return;
    }
    var ok=false;
    try{ ok = sessionStorage.getItem('ppGate')==='1' && !!localStorage.getItem('theShawnStore'); }catch(e){}
    if(ok){ unlock(); return; }   // 같은 탭 새로고침 = 로그인 유지
    show('');
  });
})();
</script>

<script>
/* ===== 시작 스플래시 =====
   로고(화면의 약 50%)를 페이드 인 → 아래 진행바 0%~100% + "최신자료로 업데이트 중입니다."
   진행바가 차는 동안 실제로 최신 데이터를 내려받고, 끝나면 페이드 아웃되며 메인으로 들어간다.
   · 로고 파일은 루트의 H-MART_LOGO.jpg 사용 (없으면 내장 로고로 대체)
   · PIN 게이트가 떠 있는 동안에는 대기했다가 로그인 직후 실행 */
(function(){
  'use strict';
  var MIN_MS=2400, MAX_MS=9000, FADE_MS=560;
  var ov=document.getElementById('bootSplash');
  if(!ov) return;
  var fill=document.getElementById('splashFill'), pct=document.getElementById('splashPct');
  var img=document.getElementById('splashLogo');

  // 로고: /H-MART_LOGO.jpg → H-MART_LOGO.jpg → 내장 로고
  var srcs=(window.LOGO_SRCS||['/H-MART_LOGO.jpg','H-MART_LOGO.jpg']), si=0;
  function nextSrc(){
    if(si<srcs.length){ img.src=srcs[si++]; return; }
    var em=document.getElementById('hmartLogo');
    if(em && em.src) img.src=em.src;
  }
  img.addEventListener('error', nextSrc);
  nextSrc();

  function setPct(p){
    var v=Math.max(0, Math.min(100, p));
    fill.style.width=v.toFixed(1)+'%';
    pct.textContent=Math.round(v)+'%';
  }
  function finish(){
    setPct(100);
    setTimeout(function(){
      ov.classList.add('out');
      setTimeout(function(){ ov.classList.remove('show'); if(ov.parentNode) ov.parentNode.removeChild(ov); }, FADE_MS+60);
    }, 300);
  }
  var started=false;
  function run(){
    if(started) return; started=true;
    // 어느 매장 자료를 가져오는지 표시 (매장별 설정도 함께 내려받음)
    try{
      var st=(localStorage.getItem('theShawnStore')||'').toUpperCase().trim();
      var tx=document.getElementById('splashTxt');
      if(st && tx) tx.textContent=st+' · 최신자료로 업데이트 중입니다.';
    }catch(e){}
    ov.classList.add('show');
    var t0=Date.now(), p=0, done=false;
    // 실제 데이터 업데이트 (실패해도 저장된 데이터로 진행)
    try{
      var task=window.__ppRefresh ? window.__ppRefresh(true) : null;
      if(task && task.then) task.then(function(){ done=true; }, function(){ done=true; });
      else done=true;
    }catch(e){ done=true; }
    setTimeout(function(){ done=true; }, MAX_MS);
    (function tick(){
      var el=Date.now()-t0;
      var target=done ? 100 : Math.min(93, (el/MIN_MS)*93);
      p+=(target-p)*0.16;
      if(target-p<0.5) p=target;
      setPct(p);
      if(done && p>=99.5 && el>=MIN_MS){ finish(); return; }
      requestAnimationFrame(tick);
    })();
  }

  function start(){
    var de=document.documentElement;
    if(!de.classList.contains('pp-gate-lock')){ run(); return; }
    // 매장 PIN 게이트 통과를 기다렸다가 실행
    var mo=new MutationObserver(function(){
      if(!de.classList.contains('pp-gate-lock')){ mo.disconnect(); run(); }
    });
    mo.observe(de, { attributes:true, attributeFilter:['class'] });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
