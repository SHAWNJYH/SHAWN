<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ --gold:#c9a961; --gold-d:#b08d3f; --ink:#1f2430; --sub:#6b7280; --line:#e5e7eb; --bg2:#f6f7f9; }
  *{ box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif; }
  html,body{ height:100%; }
  body{ background:#eef0f4; display:flex; align-items:center; justify-content:center; overflow:hidden; }

  /* ── 크기 토큰 (S/M/L 은 body 클래스) ───────────────── */
  body.sz-s{ --fs:11.5px; --fs-sm:10px;  --pad:9px;  --gap:6px;  --btn-h:26px; --keyh:30px; --key-fs:12.5px; --res-fs:19px; --rad:11px; --rad-in:8px;  --card-w:280px; --card-h:410px; }
  body.sz-m{ --fs:13px;   --fs-sm:11px;  --pad:12px; --gap:8px;  --btn-h:32px; --keyh:40px; --key-fs:15px;   --res-fs:24px; --rad:14px; --rad-in:10px; --card-w:350px; --card-h:510px; }
  body.sz-l{ --fs:14.5px; --fs-sm:12px;  --pad:16px; --gap:10px; --btn-h:38px; --keyh:50px; --key-fs:17px;   --res-fs:30px; --rad:16px; --rad-in:11px; --card-w:430px; --card-h:630px; }

  /* ── 카드: 단독 실행 시 고정 크기(4개 도구 완전 동일), iframe(embed) 시 꽉 채움 ── */
  #card{ width:var(--card-w); height:var(--card-h); background:#fff; border:1px solid var(--line);
    border-radius:var(--rad); overflow:hidden; box-shadow:0 12px 34px rgba(15,20,40,.10);
    display:flex; flex-direction:column; font-size:var(--fs); color:var(--ink);
    transition:width .18s, height .18s; }
  body.embed{ background:#fff; }
  body.embed #card{ width:100vw; height:100vh; border:0; border-radius:0; box-shadow:none; transition:none; }

  /* ── 헤더: 제목 + S M L ───────────────────────────── */
  #head{ flex:none; display:flex; align-items:center; gap:8px; padding:calc(var(--pad)*.62) var(--pad);
    background:linear-gradient(135deg,#1a1a2e 0%,#2d2d44 100%); }
  #head .tick{ width:4px; height:1.05em; border-radius:2px; background:var(--gold); flex:none; }
  #head .tt{ color:#fff; font-weight:700; font-size:calc(var(--fs) + 1px); letter-spacing:.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #head .sp{ flex:1; }
  .sml{ display:flex; gap:3px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16);
    border-radius:9px; padding:2px; flex:none; }
  .sml button{ border:0; background:transparent; color:rgba(255,255,255,.66); font-size:var(--fs-sm);
    font-weight:800; width:2.1em; height:1.9em; border-radius:7px; cursor:pointer; line-height:1;
    transition:background .13s,color .13s; }
  .sml button.on{ background:linear-gradient(135deg,var(--gold),var(--gold-d)); color:#fff; }

  /* ── 본문 공통 ───────────────────────────────────── */
  #bodyc{ flex:1; min-height:0; padding:var(--pad); display:flex; flex-direction:column; gap:var(--gap); }
  .lbl{ flex:none; display:flex; align-items:center; justify-content:space-between;
    font-size:var(--fs-sm); color:var(--sub); font-weight:600; letter-spacing:.02em; }
  .lbl .st{ font-weight:500; color:var(--gold-d); }
  .ta{ flex:1; min-height:0; width:100%; resize:none; border:1px solid var(--line); border-radius:var(--rad-in);
    padding:calc(var(--pad)*.6); font-size:var(--fs); line-height:1.5; background:var(--bg2);
    color:var(--ink); outline:none; }
  .ta:focus{ border-color:var(--gold); background:#fff; box-shadow:0 0 0 3px rgba(201,169,97,.15); }
  .row{ flex:none; display:flex; gap:var(--gap); flex-wrap:nowrap; }
  .row .grow{ flex:1; }
  .btn{ height:var(--btn-h); padding:0 calc(var(--pad)*.7); border:1px solid var(--line); border-radius:var(--rad-in);
    background:var(--bg2); color:var(--ink); font-size:var(--fs); font-weight:600; cursor:pointer;
    transition:background .13s, transform .08s; white-space:nowrap; }
  .btn:hover{ background:#eef0f3; } .btn:active{ transform:scale(.97); }
  .btn.gold{ background:linear-gradient(135deg,var(--gold),var(--gold-d)); color:#fff; border:0; }
  .btn.gold:hover{ filter:brightness(1.06); }
  .btn.ghost{ background:transparent; }

  /* ── 토스트 ─────────────────────────────────────── */
  .toast{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(8px); z-index:99;
    background:rgba(26,26,46,.94); color:#fff; font-size:12px; font-weight:600; padding:8px 16px;
    border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.28); opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err{ background:rgba(190,50,50,.95); }

  /* 계산기 전용 */
  #scr{ flex:none; background:linear-gradient(135deg,#1a1a2e 0%,#2d2d44 100%); border-radius:var(--rad-in);
    padding:calc(var(--pad)*.7) var(--pad); text-align:right; }
  #cExpr{ min-height:1.2em; color:rgba(255,255,255,.55); font-size:var(--fs-sm); }
  #cRes{ color:#fff; font-size:var(--res-fs); font-weight:700; line-height:1.15;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #keys{ flex:1; min-height:0; display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:1fr; gap:var(--gap); }
  .ckey{ border:0; border-radius:var(--rad-in); font-size:var(--key-fs); font-weight:600;
    background:var(--bg2); color:var(--ink); cursor:pointer; transition:background .12s, transform .07s; }
  .ckey:hover{ background:#eceef2; } .ckey:active{ transform:scale(.95); }
  .ckey.fn{ background:#e8eaef; color:#3a4150; }
  .ckey.op{ background:linear-gradient(135deg,var(--gold),var(--gold-d)); color:#fff; }
  .ckey.op.active{ background:#fff; color:var(--gold-d); box-shadow:inset 0 0 0 2px var(--gold); }
  .ckey.eq{ background:linear-gradient(135deg,#2d2d44,#1a1a2e); color:var(--gold); }
</style>
</head>
<body class="sz-m">

<div id="card">
  <div id="head">
    <span class="tick"></span>
    <span class="tt">🧮 계산기</span>
    <span class="sp"></span>
    <div class="sml">
      <button data-s="s">S</button>
      <button data-s="m">M</button>
      <button data-s="l">L</button>
    </div>
  </div>
  <div id="bodyc">
    <div id="scr"><div id="cExpr"></div><div id="cRes">0</div></div>
    <div id="keys">
      <button class="ckey fn" data-k="ac">AC</button><button class="ckey fn" data-k="back">⌫</button><button class="ckey fn" data-k="pct">%</button><button class="ckey op" data-k="div">÷</button>
      <button class="ckey" data-k="7">7</button><button class="ckey" data-k="8">8</button><button class="ckey" data-k="9">9</button><button class="ckey op" data-k="mul">×</button>
      <button class="ckey" data-k="4">4</button><button class="ckey" data-k="5">5</button><button class="ckey" data-k="6">6</button><button class="ckey op" data-k="sub">−</button>
      <button class="ckey" data-k="1">1</button><button class="ckey" data-k="2">2</button><button class="ckey" data-k="3">3</button><button class="ckey op" data-k="add">+</button>
      <button class="ckey fn" data-k="sign">±</button><button class="ckey" data-k="0">0</button><button class="ckey" data-k="dot">.</button><button class="ckey eq" data-k="eq">=</button>
    </div>
  </div>
</div>

<script>
/* ── 로직 모듈(원본 그대로 내장 — 외부 파일 의존 없음) ── */
/* ============================================================
   Function-Calculator.js
   공용 계산기 모듈 (로그인 메뉴 / EGMM(ODP) / 추후 H-MART 공통)
   - window.FunctionCalc.fmt(n) / wire(cfg)
   - wire() 호출마다 독립된 상태(state)를 가진 계산기를 만듭니다.
   cfg 예시:
     로그인:  { keysSelector:'#calcScreen .calc-grid', keyClass:'calc-key',
               expr:'calcExpr', result:'calcResult',
               keyboardActiveSelector:'#calcScreen' }
     ODP:    { keysId:'odCalcKeys', keyClass:'odp-ckey',
               expr:'odCalcExpr', result:'odCalcRes' }
   keyboardActiveSelector 가 있으면, 해당 요소에 'active' 클래스가 있을 때만
   키보드 입력을 받습니다(없으면 키보드 입력 미사용).
   ============================================================ */
(function () {
  'use strict';

  var OPS = { add: '+', sub: '−', mul: '×', div: '÷' };
  var $ = function (id) { return document.getElementById(id); };

  // 부동소수점 오차 정리 + 보기 좋은 포맷
  function fmt(n) {
    if (!isFinite(n)) return '오류';
    if (n === 0) return '0';
    var r = Math.round((n + Number.EPSILON) * 1e10) / 1e10;
    var s = String(r);
    if (s.replace('-', '').replace('.', '').length > 14) s = String(Number(r.toPrecision(12)));
    return s;
  }
  function compute(a, b, op) {
    if (op === 'add') return a + b;
    if (op === 'sub') return a - b;
    if (op === 'mul') return a * b;
    if (op === 'div') return b === 0 ? NaN : a / b;
    return b;
  }

  function wire(cfg) {
    cfg = cfg || {};
    var keysEl = cfg.keysSelector ? document.querySelector(cfg.keysSelector)
               : (cfg.keysId ? $(cfg.keysId) : null);
    var resEl = $(cfg.result);
    var exprEl = cfg.expr ? $(cfg.expr) : null;
    if (!keysEl || !resEl) return null;
    var keyClass = cfg.keyClass || 'calc-key';

    var st = { cur: '0', first: null, op: null, waiting: false };

    function render() {
      resEl.textContent = st.cur;
      if (exprEl) exprEl.textContent = (st.first != null && st.op) ? (fmt(st.first) + ' ' + OPS[st.op]) : '';
      var ops = keysEl.querySelectorAll('.' + keyClass + '.op');
      Array.prototype.forEach.call(ops, function (b) {
        b.classList.toggle('active', !!(st.op && b.dataset.k === st.op && st.waiting));
      });
    }

    function handle(k) {
      if (st.cur === '오류' && !/^[0-9]$/.test(k) && k !== 'ac' && k !== 'dot') {
        if (k === 'ac') { st.cur = '0'; st.first = null; st.op = null; st.waiting = false; render(); }
        return;
      }
      if (/^[0-9]$/.test(k)) {
        if (st.cur === '오류') { st.cur = k; st.waiting = false; }
        else if (st.waiting) { st.cur = k; st.waiting = false; }
        else st.cur = (st.cur === '0') ? k : st.cur + k;
      } else if (k === 'dot') {
        if (st.cur === '오류' || st.waiting) { st.cur = '0.'; st.waiting = false; }
        else if (st.cur.indexOf('.') === -1) st.cur += '.';
      } else if (OPS[k]) {
        var v = parseFloat(st.cur) || 0;
        if (st.op && !st.waiting) { var r = compute(st.first, v, st.op); st.cur = fmt(r); st.first = isFinite(r) ? r : null; }
        else st.first = v;
        st.op = k; st.waiting = true;
      } else if (k === 'eq') {
        if (st.op != null && st.first != null) {
          var r2 = compute(st.first, parseFloat(st.cur) || 0, st.op);
          st.cur = fmt(r2); st.first = null; st.op = null; st.waiting = true;
        }
      } else if (k === 'ac') { st.cur = '0'; st.first = null; st.op = null; st.waiting = false; }
      else if (k === 'back') {
        if (!(st.waiting || st.cur === '오류')) { st.cur = st.cur.length > 1 ? st.cur.slice(0, -1) : '0'; if (st.cur === '-') st.cur = '0'; }
      } else if (k === 'pct') { var p = parseFloat(st.cur); if (!isNaN(p)) st.cur = fmt(p / 100); }
      else if (k === 'sign') { if (st.cur !== '0' && st.cur !== '오류') st.cur = st.cur.charAt(0) === '-' ? st.cur.slice(1) : '-' + st.cur; }
      render();
    }

    keysEl.addEventListener('click', function (e) {
      var b = e.target.closest('.' + keyClass);
      if (!b) return;
      handle(b.dataset.k);
    });

    if (cfg.keyboardActiveSelector) {
      document.addEventListener('keydown', function (e) {
        var gate = document.querySelector(cfg.keyboardActiveSelector);
        if (!gate || !gate.classList.contains('active')) return;
        var k = e.key;
        if (/^[0-9]$/.test(k)) handle(k);
        else if (k === '.') handle('dot');
        else if (k === '+') handle('add');
        else if (k === '-') handle('sub');
        else if (k === '*') handle('mul');
        else if (k === '/') { e.preventDefault(); handle('div'); }
        else if (k === 'Enter' || k === '=') { e.preventDefault(); handle('eq'); }
        else if (k === 'Backspace') handle('back');
        else if (k === 'Escape') handle('ac');
        else if (k === '%') handle('pct');
      });
    }

    render();
    return { handle: handle };
  }

  window.FunctionCalc = { fmt: fmt, wire: wire };
})();

</script>
<script>

  var $=function(id){ return document.getElementById(id); };
  /* 토스트 */
  window.showToast=function(msg,type){
    var t=document.createElement('div'); t.className='toast'+(type==='error'?' err':''); t.textContent=msg;
    document.body.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },250); },1700);
  };
  /* iframe(멀티뷰 패널/팝업) 안에서는 카드가 화면을 꽉 채움 */
  try{ if(window.self!==window.top || /[?&]embed=1/.test(location.search)) document.body.classList.add('embed'); }catch(e){ document.body.classList.add('embed'); }
  /* S/M/L — 4개 도구가 공유하는 저장 키(브라우저별 유지) */
  (function(){
    var KEY='shawnFnToolSize';
    var cur=localStorage.getItem(KEY); if(cur!=='s'&&cur!=='m'&&cur!=='l') cur='m';
    function apply(s){
      cur=s;
      document.body.classList.remove('sz-s','sz-m','sz-l');
      document.body.classList.add('sz-'+s);
      var bs=document.querySelectorAll('.sml button');
      Array.prototype.forEach.call(bs,function(b){ b.classList.toggle('on', b.dataset.s===s); });
      try{ localStorage.setItem(KEY,s); }catch(e){}
    }
    document.querySelector('.sml').addEventListener('click',function(e){
      var b=e.target.closest('button'); if(b) apply(b.dataset.s);
    });
    apply(cur);
  })();

  /* 화면 연결 */
  FunctionCalc.wire({ keysId:'keys', keyClass:'ckey', expr:'cExpr', result:'cRes',
    keyboardActiveSelector:'body' /* 단독/패널에서 항상 키보드 입력 허용 */ });
  document.body.classList.add('active'); /* keyboardActiveSelector 게이트 통과용 */
</script>
</body>
</html>
