<style>
  :root{
    /* ── DESIGN SYSTEM "Paper & Pine" (homepage-manager 공통) ── */
    --bg:#EDEAE3; --bg-elev:#FFFDFA; --bg-elev-2:#F7F4ED; --border:#E4DFD4; --border-bright:#D6CFC0;

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--mono);

    text-transform:uppercase; }
  .pv-btn:hover{ border-color:var(--danger); color:var(--danger); background:var(--danger-soft); }
  .pv-btn:active{ transform:scale(.97); }

  /* ── 무대: 카드 가운데 ── */

  .plu-quiz-card::before{ content:''; position:absolute; top:0; left:22px; right:22px; height:3px; border-radius:0 0 3px 3px;

  .plu-quiz-close{ position:absolute; top:12px; right:14px; border:none; background:transparent;

  /* ── 선택 화면 ── */

  .plu-quiz-reveal{ flex:0 0 auto; border:1.5px solid var(--brass); background:#F5EFE2; color:#7A6234;
    border-radius:11px; padding:15px 16px; font-family:var(--mono); font-size:15px; font-weight:800; cursor:pointer;

  .plu-quiz-skip{ flex:0 0 auto; border:1.5px solid var(--border); background:transparent; color:var(--text-dim);

  /* 플레이어 이름 */

    font-weight:800; letter-spacing:.06em; color:var(--accent-warm); margin:22px 0 8px; }

  .pq-stat-value{ font-family:var(--code); font-size:24px; font-weight:900; color:var(--text); line-height:1; }
  .pq-stat-value.ok{ color:var(--success); }

  @media (max-width:600px){

    .plu-quiz-stage{ padding:20px 14px 34px; }
    .plu-quiz-card{ padding:26px 18px 22px; }
    .plu-quiz-body{ flex-direction:column-reverse; gap:14px; }
    .plu-quiz-photo{ flex:none; width:100%; height:280px; align-self:stretch; }
    .plu-quiz-name{ font-size:30px; }
    .plu-quiz-stats{ grid-template-columns:repeat(2, 1fr); }
    .plu-quiz-entry-row{ flex-wrap:wrap; }
    .plu-quiz-entry-row .plu-quiz-store-select, .plu-quiz-entry-row .plu-quiz-name-input{ flex:1 1 100%; }
  }

  /* 토스트 */
  .toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--accent); color:#fff; padding:12px 20px; border-radius:10px;
    font-family:var(--mono); font-size:14px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:300; max-width:90vw; text-align:center; text-transform:none; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error{ background:var(--danger); }
  .toast.success{ background:var(--success); }
</style>

<body>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  // ---------- 토스트 ----------
  let toastTimer;
  function showToast(msg, type) {
    const toast = $('toast');
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = 'toast show ' + (type || '');
    toastTimer = setTimeout(() => { toast.className = 'toast ' + (type || ''); }, 2500);
  }

  // ===== PLU CSV 데이터 로딩 =====
  // TOOLS/ 폴더 기준 — 루트에 둔 CSV를 ../ 로 불러온다.
  const PLU_CSV_CANDIDATES = [
    '../PLU - PRODUCE.csv', '../PLU_-_PRODUCE.csv', '../PLU-PRODUCE.csv',
    '../PLU - PRODUCE.CSV', '../PLU_-_PRODUCE.CSV'
  ];
  let pluData = null;
  let pluLoadPromise = null;

  function parsePluCsv(text) {
    text = text.replace(/^\uFEFF/, '');                // BOM 제거
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    lines.shift();                                     // 헤더 제거
    return lines.map(line => {
      const c = line.split(',');
      return {
        plu: (c[0] || '').trim(),
        itemCode: (c[1] || '').trim(),
        eng: (c[2] || '').trim(),
        kor: (c[3] || '').trim(),
        origin: (c[4] || '').trim(),
        cateEng: (c[5] || '').trim(),
        cateKor: (c[6] || '').trim(),
        cateNo: (c[7] || '').trim(),
        localPlu: (c[8] || '').trim(),
        organic: (c[9] || '').trim()
      };
    });
  }

  // Firebase 준비 대기
  function fbReady() {
    return new Promise(res => {
      if (window.firebaseFns && window.firebaseDb) return res();
      window.addEventListener('plu-firebase-ready', () => res(), { once: true });
      setTimeout(res, 2500);
    });
  }
  // 행에서 값을 base 필드 또는 extra(대소문자 무시)에서 찾아온다
  function pickField(r, names) {
    for (let i = 0; i < names.length; i++) { const n = names[i]; if (r[n] != null && String(r[n]).trim() !== '') return String(r[n]).trim(); }
    if (r.extra) { for (let i = 0; i < names.length; i++) { const want = String(names[i]).toLowerCase(); for (const k in r.extra) { if (String(k).toLowerCase() === want) { const v = r.extra[k]; if (v != null && String(v).trim() !== '') return String(v).trim(); } } } }
    return '';
  }
  // Firebase plu-list에서 PRODUCE 데이터 읽기 — 최신 저장 구조(압축·청크 문서) 및 구식(단일 rows) 모두 지원
  function __qB64ToU8(b64){ const bin=atob(b64), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }
  function __qRowsOf(d){ try{ if(d && d.comp && typeof pako!=='undefined'){ return JSON.parse(pako.ungzip(__qB64ToU8(d.data),{to:'string'})); } }catch(e){} return (d && Array.isArray(d.rows))?d.rows:[]; }
  function __qMapRows(rows){
    return rows.map(r => ({
      plu: pickField(r, ['plu', 'PLU']),
      eng: pickField(r, ['eng', 'ENG', 'ENG DESC', 'ENGLISH', '영문명']),
      kor: pickField(r, ['kor', 'KOR', 'KOR DESC', 'KOREAN', '한글명']),
      localPlu: pickField(r, ['local', 'LOCAL', '로컬']),
      organic: pickField(r, ['organic', 'ORGANIC', '유기농']),
      cateKor: '', cateEng: '', origin: pickField(r, ['origin', 'ORIGIN', '원산지']), itemCode: '', cateNo: ''
    }));
  }
  async function loadFromFirebase() {
    await fbReady();
    if (!window.firebaseFns || !window.firebaseDb) return null;
    const fns = window.firebaseFns;
    // 1) 구식: 단일 문서 rows
    try {
      const snap = await fns.getDoc(fns.doc(window.firebaseDb, 'plu-list', 'PRODUCE'));
      if (snap && snap.exists()) {
        const d = snap.data() || {};
        const rows = __qRowsOf(d);
        if (rows.length) return __qMapRows(rows);
      }
    } catch (e) { /* 폴백 */ }
    // 2) 최신: 청크 문서(parent 필드 또는 'PRODUCE__cN' id) 병합
    try {
      if (fns.getDocs && fns.collection) {
        const qs = await fns.getDocs(fns.collection(window.firebaseDb, 'plu-list'));
        const chunks = [];
        qs.forEach(ds => {
          const id = ds.id, d = ds.data() || {};
          if (d.parent === 'PRODUCE') {
            chunks.push({ sub: (d.sub != null ? String(d.sub) : ''), ci: (typeof d.ci === 'number' ? d.ci : 0), rows: __qRowsOf(d) });
          } else {
            const mc = /^(.*)__c(\d+)$/.exec(id);
            if (mc && mc[1] === 'PRODUCE') chunks.push({ sub: '', ci: parseInt(mc[2], 10), rows: __qRowsOf(d) });
          }
        });
        if (chunks.length) {
          const bySub = {}, subOrder = [];
          chunks.forEach(c => { if (!(c.sub in bySub)) { bySub[c.sub] = []; subOrder.push(c.sub); } bySub[c.sub].push(c); });
          let rows = [];
          subOrder.forEach(sn => { bySub[sn].sort((a, b) => a.ci - b.ci).forEach(c => { rows = rows.concat(c.rows); }); });
          if (rows.length) return __qMapRows(rows);
        }
      }
    } catch (e) { /* 폴백 */ }
    return null;
  }

  function loadPluData() {
    if (pluData) return Promise.resolve(pluData);
    if (pluLoadPromise) return pluLoadPromise;
    pluLoadPromise = (async () => {
      // 1) Firebase 우선
      const fb = await loadFromFirebase();
      if (fb && fb.length) { pluData = fb; return pluData; }
      // 2) CSV 폴백 (루트 폴더에 CSV가 있을 때)
      for (const name of PLU_CSV_CANDIDATES) {
        try {
          const res = await fetch(encodeURI(name), { cache: 'no-store' });
          if (res.ok) {
            const text = await res.text();
            const parsed = parsePluCsv(text);
            if (parsed.length) { pluData = parsed; return pluData; }
          }
        } catch (e) { /* 다음 후보 시도 */ }
      }
      pluLoadPromise = null;
      throw new Error('데이터를 불러오지 못했습니다');
    })();
    return pluLoadPromise;
  }

  // ===== PLU 외우기 퀴즈 =====
  let quizCat = 'veg';        // 'veg' | 'fruit'
  let quizPool = [];
  let quizCurrent = null;
  let quizCorrect = 0;        // 맞춘 수
  let quizWrong = 0;          // 틀린 수
  let quizAnswered = false;
  let quizStartTime = 0;      // 퀴즈 시작 시각(ms)
  let quizTimerId = null;     // 시간 표시 인터벌
  let quizTimerStarted = false; // PLU 첫 입력 시 시작

  function getPlayerName() {
    return ($('pluQuizPlayerInput').value || '').trim();
  }
  function getStoreName() {
    return ($('pluQuizStore') && $('pluQuizStore').value || '').trim();
  }

  function fmtTime(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    const pad = n => String(n).padStart(2, '0');
    return (h > 0 ? pad(h) + ':' : '') + pad(m) + ':' + pad(sec);
  }

  function updateStats() {
    $('pluStatTotal').textContent = quizCorrect + quizWrong;
    $('pluStatCorrect').textContent = quizCorrect;
    $('pluStatWrong').textContent = quizWrong;
  }

  function startTimer() {
    quizStartTime = Date.now();
    $('pluStatTime').textContent = '00:00';
    if (quizTimerId) clearInterval(quizTimerId);
    quizTimerId = setInterval(() => {
      $('pluStatTime').textContent = fmtTime(Date.now() - quizStartTime);
    }, 1000);
  }

  function stopTimer() {
    if (quizTimerId) { clearInterval(quizTimerId); quizTimerId = null; }
  }

  function isQuizSkip(r) {
    const eng = (r.eng || '').trim().toUpperCase();
    const kor = (r.kor || '').trim().toUpperCase();
    if (/RESERVE/.test(eng) || /RESERVE/.test(kor)) return true;
    if (eng === 'ETC' || kor === 'ETC') return true;
    return false;
  }

  function buildQuizPool(cat) {
    const min = cat === 'fruit' ? 2000 : 1000;
    const max = cat === 'fruit' ? 2999 : 1999;
    return (pluData || []).filter(r => {
      const n = parseInt(r.plu, 10);
      return !isNaN(n) && n >= min && n <= max && r.kor && !isQuizSkip(r);
    });
  }

  function showSelect() {
    $('pluQuizSelect').style.display = '';
    $('pluQuizPlay').style.display = 'none';
  }

  function startQuizWith(cat) {
    if (!getStoreName()) {
      showToast('매장을 선택하세요 (SELECT STORE)', 'error');
      if ($('pluQuizStore')) $('pluQuizStore').focus();
      return;
    }
    if (!getPlayerName()) {
      showToast('PLEASE ENTER YOUR NAME', 'error');
      $('pluQuizPlayerInput').focus();
      return;
    }
    quizCat = cat;
    startPluQuiz();
  }

  function startPluQuiz() {
    $('pluQuizFeedback').textContent = '';
    loadPluData().then(() => {
      quizPool = buildQuizPool(quizCat);
      if (!quizPool.length) {
        const total = (pluData || []).length;
        const range = quizCat === 'fruit' ? 'FRUITS (PLU 2000~2999)' : 'VEGETABLES (PLU 1000~1999)';
        showToast('출제할 항목이 없습니다 · ' + range + ' · 불러온 데이터 ' + total + '건', 'error');
        return;
      }
      quizCorrect = 0;
      quizWrong = 0;
      updateStats();
      // 시간은 첫 PLU 입력 순간부터 시작 (여기서는 0으로 대기)
      stopTimer();
      quizTimerStarted = false;
      $('pluStatTime').textContent = '00:00';
      updateCatTabs();
      $('pluQuizPlayer').textContent = getStoreName() + '  ·  ' + getPlayerName();
      $('pluQuizSelect').style.display = 'none';
      $('pluQuizPlay').style.display = '';
      nextQuizQuestion();
    }).catch(() => {
      showToast('데이터를 불러오지 못했습니다', 'error');
    });
  }

  function nextQuizQuestion() {
    quizAnswered = false;
    quizCurrent = quizPool[Math.floor(Math.random() * quizPool.length)];
    $('pluQuizName').textContent = quizCurrent.eng || quizCurrent.kor;
    const ans = $('pluQuizAnswer');
    ans.value = '';
    ans.disabled = false;
    const fb = $('pluQuizFeedback');
    fb.textContent = '';
    fb.className = 'plu-quiz-feedback';
    loadQuizPhoto(quizCurrent.plu);
    setTimeout(() => ans.focus(), 50);
  }

  // PLU 번호로 사진 찾기 (파일명 = PLU 번호) — TOOLS/ 기준 루트(../) 탐색
  const QUIZ_PHOTO_DIRS = ['../images/', '../photos/', '../plu/', '../'];
  const QUIZ_PHOTO_EXTS = ['jpg', 'jpeg', 'png', 'webp'];
  let quizPhotoToken = 0;

  function loadQuizPhoto(plu) {
    const box = $('pluQuizPhoto');
    const myToken = ++quizPhotoToken;
    box.innerHTML = '<div class="ph">Loading...</div>';
    const cands = [];
    QUIZ_PHOTO_DIRS.forEach(d => QUIZ_PHOTO_EXTS.forEach(e => cands.push(d + plu + '.' + e)));
    let i = 0;
    const tryNext = () => {
      if (myToken !== quizPhotoToken) return;
      if (i >= cands.length) {
        box.innerHTML = '<div class="ph">NO PHOTO</div>';
        return;
      }
      const src = encodeURI(cands[i]);
      const probe = new Image();
      probe.onload = () => {
        if (myToken !== quizPhotoToken) return;
        box.innerHTML = '';
        const img = document.createElement('img');
        img.alt = '';
        img.src = src;
        box.appendChild(img);
      };
      probe.onerror = () => { i++; tryNext(); };
      probe.src = src;
    };
    tryNext();
  }

  function checkQuizAnswer() {
    if (quizAnswered || !quizCurrent) return;
    const raw = $('pluQuizAnswer').value.trim();
    if (raw === '') return;
    const entered = parseInt(raw, 10);
    const correct = quizPool.some(r => r.kor === quizCurrent.kor && parseInt(r.plu, 10) === entered);
    const fb = $('pluQuizFeedback');
    if (correct) {
      quizAnswered = true;
      quizCorrect++;
      updateStats();
      fb.textContent = 'Correct!';
      fb.className = 'plu-quiz-feedback ok';
      $('pluQuizAnswer').disabled = true;
      setTimeout(nextQuizQuestion, 900);
    } else {
      quizWrong++;
      updateStats();
      fb.textContent = 'TRY AGAIN';
      fb.className = 'plu-quiz-feedback no';
      const ans = $('pluQuizAnswer');
      ans.value = '';
      ans.focus();
    }
  }

  function updateCatTabs() {
    $('pluCatVeg').classList.toggle('active', quizCat === 'veg');
    $('pluCatFruit').classList.toggle('active', quizCat === 'fruit');
  }

  // 상단 탭으로 카테고리 전환 (같은 카테고리면 무시)
  function selectCat(cat) {
    if (cat === quizCat && $('pluQuizPlay').style.display !== 'none') return;
    quizCat = cat;
    startPluQuiz();
  }

  function revealQuizPlu() {
    if (!quizCurrent || quizAnswered) return;
    quizAnswered = true;
    const fb = $('pluQuizFeedback');
    fb.textContent = 'PLU: ' + quizCurrent.plu;
    fb.className = 'plu-quiz-feedback hint';
    $('pluQuizAnswer').disabled = true;
    setTimeout(nextQuizQuestion, 1000);
  }

  // 뒤로가기 / 닫기: 이전 페이지로 복귀, 없으면 메인으로
  function goBack() {
    stopTimer();
    if (document.referrer && history.length > 1) { history.back(); }
    else { window.location.href = '../index.html'; }
  }

  // ===== 이벤트 연결 =====
  $('pqBack').onclick = goBack;
  $('pluQuizClose').onclick = goBack;
  $('pluQuizVeg').onclick = () => startQuizWith('veg');
  $('pluQuizFruit').onclick = () => startQuizWith('fruit');
  $('pluCatVeg').onclick = () => selectCat('veg');
  $('pluCatFruit').onclick = () => selectCat('fruit');
  $('pluQuizSubmit').onclick = () => checkQuizAnswer();
  $('pluQuizReveal').onclick = () => revealQuizPlu();
  $('pluQuizSkip').onclick = () => nextQuizQuestion();
  $('pluQuizAnswer').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkQuizAnswer(); } });
  // 시간은 PLU 번호를 입력하는 순간부터 시작
  $('pluQuizAnswer').addEventListener('input', () => {
    if (!quizTimerStarted && $('pluQuizAnswer').value.trim() !== '') {
      quizTimerStarted = true;
      startTimer();
    }
  });

  showSelect();
})();
</script>
</body>
