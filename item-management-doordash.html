<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>ITEM MANAGEMENT · DOORDASH</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<script type="module">
  // ===== Firebase (the-shawn) : 상품/필드 실시간 연동 =====
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  try {
    const app = initializeApp({
      apiKey: "AIzaSyC6t78BS99LX3261cRmApBG8AcZ8HPVxr0",
      authDomain: "the-shawn.firebaseapp.com",
      projectId: "the-shawn",
      storageBucket: "the-shawn.firebasestorage.app",
      messagingSenderId: "519898602513",
      appId: "1:519898602513:web:0f35e3dc9c29dce21665b0",
      measurementId: "G-NKGYGC63JN"
    });
    const db = getFirestore(app);
    const auth = getAuth(app);
    window.idFb = { db, doc, setDoc, getDoc, deleteDoc, collection, onSnapshot, auth, uid: null };
    window.dispatchEvent(new Event('idfb-ready'));
    onAuthStateChanged(auth, (user) => { if (user && window.idFb) { window.idFb.uid = user.uid; window.dispatchEvent(new Event('idfb-auth')); } });
    signInAnonymously(auth).catch((e) => { console.error('anonymous auth fail', e); });
  } catch (e) { console.error('firebase init fail', e); }
</script>
<style>
  :root{
    --bg:#fafaf7; --bg-elev:#ffffff; --bg-elev-2:#f3f3ee; --border:#e5e5e0; --border-bright:#c8c8c0;
    --text:#1a1a1d; --text-dim:#6b6b72; --text-faint:#9a9aa0; --accent:#1a1a1d; --accent-warm:#c9a961; --accent-soft:#f0eee5;
    --danger:#c83a3a; --success:#2a8a4a;
    --mono:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--mono); -webkit-font-smoothing:antialiased; }
  button,input,select{ font-family:var(--mono); }

  /* ===== 상단바 ===== */
  .id-top{ position:sticky; top:0; z-index:30; background:var(--bg-elev); border-bottom:1.5px solid var(--border); }
  .id-top-in{ max-width:1280px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:14px 24px; }
  .id-back{ border:1.5px solid var(--border); background:var(--bg); color:var(--text-dim); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:800; cursor:pointer; transition:all .15s; }
  .id-back:hover{ border-color:var(--accent-warm); color:var(--text); }
  .id-brand{ display:flex; flex-direction:column; line-height:1.2; }
  .id-brand .eyebrow{ font-size:10.5px; font-weight:800; letter-spacing:.2em; color:var(--accent-warm); text-transform:uppercase; }
  .id-brand .title{ font-size:19px; font-weight:800; letter-spacing:.01em; }
  .id-spacer{ flex:1; }
  .id-user{ font-size:13px; font-weight:700; color:var(--text-dim); }
  .id-user b{ color:var(--text); }
  .id-sync{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:800; color:var(--text-faint); border:1.5px solid var(--border); border-radius:999px; padding:5px 11px; }
  .id-sync .dot{ width:8px; height:8px; border-radius:50%; background:var(--text-faint); }
  .id-sync.on .dot{ background:var(--success); box-shadow:0 0 0 3px rgba(42,138,74,.15); }
  .id-sync.off .dot{ background:var(--danger); }

  /* ===== 툴바 ===== */
  .id-wrap{ max-width:1280px; margin:0 auto; padding:22px 24px 90px; }
  .id-toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .id-btn{ border:1.5px solid var(--border); background:var(--bg-elev); color:var(--text); border-radius:11px; padding:11px 15px; font-size:13.5px; font-weight:800; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .id-btn:hover{ border-color:var(--accent-warm); background:var(--accent-soft); }
  .id-btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .id-btn.primary:hover{ background:#000; }
  .id-btn:active{ transform:scale(.98); }
  .id-search{ flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:var(--bg-elev); border:1.5px solid var(--border); border-radius:11px; padding:0 13px; }
  .id-search input{ flex:1; border:none; background:transparent; padding:11px 0; font-size:14px; color:var(--text); outline:none; }
  .id-search .ic{ color:var(--text-faint); font-size:15px; }
  .id-catsel{ border:1.5px solid var(--border); background:var(--bg-elev); color:var(--text); border-radius:11px; padding:11px 13px; font-size:13.5px; font-weight:700; cursor:pointer; }

  /* ===== 카테고리 그룹 · 테이블 ===== */
  .id-cat{ margin-bottom:26px; }
  .id-cat-head{ display:flex; align-items:center; gap:9px; margin:0 2px 10px; }
  .id-cat-tick{ width:9px; height:9px; border-radius:3px; background:var(--accent-warm); }
  .id-cat-name{ font-size:15px; font-weight:800; letter-spacing:.03em; }
  .id-cat-count{ font-size:12px; font-weight:700; color:var(--text-faint); }
  .id-tablewrap{ overflow-x:auto; border:1.5px solid var(--border); border-radius:14px; background:var(--bg-elev); }
  table.id-table{ width:100%; border-collapse:collapse; font-size:13.5px; white-space:nowrap; }
  .id-table th{ background:var(--bg-elev-2); color:var(--text-dim); font-weight:800; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; text-align:left; padding:11px 13px; border-bottom:1.5px solid var(--border); position:sticky; top:0; }
  .id-table td{ padding:10px 13px; border-bottom:1px solid var(--border); color:var(--text); }
  .id-table tr:last-child td{ border-bottom:none; }
  .id-table tbody tr{ cursor:pointer; transition:background .12s; }
  .id-table tbody tr:hover{ background:var(--accent-soft); }
  .id-table td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .id-table td.chk{ text-align:center; }
  .id-chk-on{ color:var(--success); font-weight:900; }
  .id-chk-off{ color:var(--text-faint); }
  .id-rcheck-on{ color:var(--danger); font-weight:900; }
  .id-row-actions{ text-align:right; width:1%; }
  .id-mini{ border:1.5px solid var(--border); background:var(--bg); color:var(--text-dim); border-radius:8px; padding:5px 9px; font-size:12px; font-weight:800; cursor:pointer; }
  .id-mini:hover{ border-color:var(--accent-warm); color:var(--text); }
  .id-mini.del:hover{ border-color:var(--danger); color:var(--danger); background:#fff0f0; }

  /* ===== 빈 상태 ===== */
  .id-empty{ text-align:center; padding:64px 20px; border:1.5px dashed var(--border-bright); border-radius:16px; background:var(--bg-elev); }
  .id-empty .em-ic{ font-size:34px; }
  .id-empty .em-t{ font-size:16px; font-weight:800; margin-top:12px; }
  .id-empty .em-s{ font-size:13.5px; color:var(--text-dim); margin-top:6px; line-height:1.6; }
  .id-empty .id-btn{ margin-top:16px; display:inline-block; }

  /* ===== 모달 ===== */
  .id-ov{ position:fixed; inset:0; z-index:200; background:rgba(20,20,24,.5); display:none; align-items:center; justify-content:center; padding:20px; }
  .id-ov.show{ display:flex; }
  .id-modal{ width:100%; max-width:560px; max-height:88vh; overflow:auto; background:var(--bg-elev); border:1px solid var(--border); border-radius:18px; padding:26px 26px 22px; box-shadow:0 20px 60px rgba(26,26,29,.22); position:relative; }
  .id-modal.wide{ max-width:660px; }
  .id-modal-x{ position:absolute; top:16px; right:16px; background:transparent; border:none; color:var(--text-faint); font-size:19px; cursor:pointer; line-height:1; }
  .id-modal-x:hover{ color:var(--text); }
  .id-modal h3{ font-size:20px; font-weight:800; margin-bottom:4px; }
  .id-modal .sub{ font-size:13px; color:var(--text-faint); margin-bottom:18px; }
  .id-fld{ margin-bottom:13px; }
  .id-fld label{ display:block; font-size:12.5px; font-weight:800; color:var(--text-dim); margin-bottom:6px; letter-spacing:.02em; }
  .id-fld input[type=text], .id-fld input[type=number], .id-fld select{ width:100%; border:1.5px solid var(--border); background:var(--bg); color:var(--text); border-radius:10px; padding:11px 13px; font-size:14.5px; transition:border-color .15s; }
  .id-fld input:focus, .id-fld select:focus{ outline:none; border-color:var(--accent-warm); background:#fff; }
  .id-fld .with-unit{ position:relative; }
  .id-fld .with-unit .unit{ position:absolute; right:13px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-weight:800; font-size:13px; }
  .id-check-fld{ display:flex; align-items:center; justify-content:space-between; border:1.5px solid var(--border); border-radius:10px; padding:10px 13px; background:var(--bg); }
  .id-check-fld span{ font-size:14px; font-weight:700; }
  .id-check-fld input{ width:20px; height:20px; accent-color:var(--accent-warm); cursor:pointer; }
  .id-modal-actions{ display:flex; gap:9px; margin-top:20px; }
  .id-modal-actions .id-btn{ flex:1; text-align:center; padding:13px; }
  .id-danger-link{ background:none; border:none; color:var(--danger); font-size:12.5px; font-weight:800; cursor:pointer; margin-top:12px; }
  .id-danger-link:hover{ text-decoration:underline; }

  /* ===== 필드 관리 ===== */
  .mf-add{ display:grid; grid-template-columns:1fr 150px auto; gap:9px; margin-bottom:16px; }
  .mf-add input, .mf-add select{ border:1.5px solid var(--border); background:var(--bg); border-radius:10px; padding:11px 12px; font-size:14px; }
  .mf-add input:focus, .mf-add select:focus{ outline:none; border-color:var(--accent-warm); }
  .mf-list{ display:flex; flex-direction:column; gap:8px; }
  .mf-row{ display:grid; grid-template-columns:auto 1fr 130px auto; gap:9px; align-items:center; border:1.5px solid var(--border); border-radius:11px; padding:9px 11px; background:var(--bg-elev); }
  .mf-ord{ display:flex; flex-direction:column; gap:2px; }
  .mf-ord button{ border:1px solid var(--border); background:var(--bg); border-radius:5px; width:22px; height:16px; line-height:1; font-size:10px; cursor:pointer; color:var(--text-dim); }
  .mf-ord button:hover{ border-color:var(--accent-warm); color:var(--text); }
  .mf-row .mf-name{ border:1.5px solid transparent; background:transparent; font-size:14px; font-weight:700; padding:6px 8px; border-radius:8px; }
  .mf-row .mf-name:focus{ outline:none; border-color:var(--accent-warm); background:#fff; }
  .mf-row select.mf-type{ border:1.5px solid var(--border); background:var(--bg); border-radius:8px; padding:7px 8px; font-size:12.5px; font-weight:700; }
  .mf-del{ border:1.5px solid var(--border); background:var(--bg); color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:800; cursor:pointer; }
  .mf-del:hover{ border-color:var(--danger); color:var(--danger); background:#fff0f0; }
  .mf-empty{ text-align:center; color:var(--text-faint); font-size:13px; font-weight:700; padding:26px; border:1.5px dashed var(--border-bright); border-radius:12px; }

  /* ===== 토스트 ===== */
  .id-toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--accent); color:#fff; padding:12px 20px; border-radius:12px; font-size:13.5px; font-weight:800; box-shadow:0 12px 34px rgba(26,26,29,.28); opacity:0; pointer-events:none; transition:all .25s; z-index:400; }
  .id-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:640px){
    .id-top-in, .id-wrap{ padding-left:14px; padding-right:14px; }
    .mf-add{ grid-template-columns:1fr; }
    .id-brand .title{ font-size:16px; }
  }
</style>
</head>
<body>
<!-- ===== 상단바 ===== -->
<div class="id-top">
  <div class="id-top-in">
    <button class="id-back" id="idBack" type="button">← DOORDASH</button>
    <div class="id-brand">
      <span class="eyebrow">DOORDASH</span>
      <span class="title">ITEM MANAGEMENT</span>
    </div>
    <div class="id-spacer"></div>
    <span class="id-user" id="idUser"></span>
    <span class="id-sync" id="idSync"><span class="dot"></span><span id="idSyncTxt">연결 중…</span></span>
  </div>
</div>

<!-- ===== 본문 ===== -->
<div class="id-wrap">
  <div class="id-toolbar">
    <button class="id-btn primary" id="btnAdd" type="button">＋ 상품등록</button>
    <button class="id-btn" id="btnFields" type="button">🗂 필드 관리</button>
    <div class="id-search"><span class="ic">🔎</span><input id="searchInput" type="text" placeholder="상품 검색 (카테고리·필드값)"></div>
    <select class="id-catsel" id="catFilter"><option value="">전체 카테고리</option></select>
  </div>
  <div id="idList"><div class="id-empty"><div class="em-ic">🛒</div><div class="em-t">불러오는 중…</div></div></div>
</div>

<!-- ===== 상품 등록/변경 모달 ===== -->
<div class="id-ov" id="itemOv">
  <div class="id-modal" id="itemModal">
    <button class="id-modal-x" id="itemClose" type="button">✕</button>
    <h3 id="itemTitle">상품 등록</h3>
    <div class="sub" id="itemSub">카테고리와 필드 값을 입력하세요.</div>
    <div class="id-fld">
      <label for="itemCat">카테고리</label>
      <input id="itemCat" type="text" list="catList" placeholder="예: 반찬 / 음료 / 밀키트" autocomplete="off">
      <datalist id="catList"></datalist>
    </div>
    <div id="itemFields"></div>
    <div class="id-modal-actions">
      <button class="id-btn" id="itemCancel" type="button">취소</button>
      <button class="id-btn primary" id="itemSave" type="button">저장</button>
    </div>
    <div style="text-align:center;"><button class="id-danger-link" id="itemDelete" type="button" style="display:none;">이 상품 삭제</button></div>
  </div>
</div>

<!-- ===== 필드 관리 모달 ===== -->
<div class="id-ov" id="fieldsOv">
  <div class="id-modal wide" id="fieldsModal">
    <button class="id-modal-x" id="fieldsClose" type="button">✕</button>
    <h3>🗂 필드 관리</h3>
    <div class="sub">상품에 사용할 필드를 추가·정렬·삭제합니다. (UPC 매니저와 동일한 필드 형태)</div>
    <div class="mf-add">
      <input id="mfNewName" type="text" placeholder="새 필드 이름 (예: ENG DESC)" maxlength="40" autocomplete="off">
      <select id="mfNewType">
        <option value="text">텍스트</option>
        <option value="rcheck">체크</option>
        <option value="check">매장체크</option>
        <option value="price">가격 ($)</option>
        <option value="margin">마진 (%)</option>
      </select>
      <button class="id-btn primary" id="mfAdd" type="button">＋ 추가</button>
    </div>
    <div class="mf-list" id="mfList"></div>
  </div>
</div>

<div class="id-toast" id="idToast"></div>

<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  /* ===== Firebase 참조 / 경로 ===== */
  var CFG_COL='doordash-config', CFG_DOC='main';   // { fields:[{key,label,type}] }  — UPC masterFields 와 동일 포맷, 독립 문서(빈 상태 시작)
  var ITEM_COL='doordash-items';                    // 문서당 상품 1개 { id, category, values, updatedAt }
  function fb(){ return window.idFb; }
  function ready(){ return !!(fb() && fb().db && fb().onSnapshot); }

  /* ===== 상태 ===== */
  var fields=[];   // [{key,label,type}]  type: text|rcheck|check|price|margin
  var items=[];    // [{id,category,values,updatedAt}]
  var searchQ='', filterCat='', editingId=null;

  /* ===== 게이트: doordash 로그인 확인 ===== */
  function gateUser(){
    try{ return JSON.parse(sessionStorage.getItem('doordashUser')||localStorage.getItem('doordashUser')||'null'); }catch(e){ return null; }
  }
  function gateOn(){
    try{ return sessionStorage.getItem('doordashGate')==='1' || localStorage.getItem('doordashAutoLogin')==='1'; }catch(e){ return false; }
  }
  (function initGate(){
    if(!gateOn()){ location.replace('doordash.html'); return; }
    var u=gateUser();
    $('idUser').innerHTML = u&&u.name ? ('<b>'+esc(u.name)+'</b> 님') : '';
  })();

  /* ===== 필드 타입 유틸 (UPC 매니저와 동일) ===== */
  function normType(t){ t=String(t||''); return (t==='rcheck'||t==='check'||t==='price'||t==='margin')?t:'text'; }
  function typeLabel(t){ return ({text:'텍스트',rcheck:'체크',check:'매장체크',price:'가격 ($)',margin:'마진 (%)'})[normType(t)]; }
  function isCheck(t){ t=normType(t); return t==='rcheck'||t==='check'; }
  function isNum(t){ t=normType(t); return t==='price'||t==='margin'; }
  function normFields(arr){
    var seen={}, out=[];
    (arr||[]).forEach(function(f){
      if(!f||f.key==null) return;
      var K=String(f.key).trim().toUpperCase(); if(!K||seen[K]) return; seen[K]=1;
      out.push({ key:K, label:(f.label!=null?String(f.label):K), type:normType(f.type) });
    });
    return out;
  }

  /* ===== 표시 포맷 ===== */
  function fmtValue(f, v){
    var t=normType(f.type);
    if(isCheck(t)){ return v ? '<span class="'+(t==='rcheck'?'id-rcheck-on':'id-chk-on')+'">✓</span>' : '<span class="id-chk-off">·</span>'; }
    if(v==null||v==='') return '<span class="id-chk-off">·</span>';
    if(t==='price'){ var n=parseFloat(v); return isNaN(n)?esc(v):('$'+n.toFixed(2)); }
    if(t==='margin'){ var m=parseFloat(v); return isNaN(m)?esc(v):(m+'%'); }
    return esc(v);
  }
  function tdClass(t){ t=normType(t); if(isNum(t)) return 'num'; if(isCheck(t)) return 'chk'; return ''; }

  /* ===== 토스트 ===== */
  var toastT=null;
  function toast(msg){ var el=$('idToast'); if(!el) return; el.textContent=msg; el.classList.add('show'); if(toastT) clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove('show'); }, 1800); }

  /* ===== 동기화 표시 ===== */
  function setSync(state){ // 'on' | 'off' | 'wait'
    var el=$('idSync'), tx=$('idSyncTxt'); if(!el) return;
    el.classList.remove('on','off');
    if(state==='on'){ el.classList.add('on'); tx.textContent='실시간 연결됨'; }
    else if(state==='off'){ el.classList.add('off'); tx.textContent='연결 끊김'; }
    else { tx.textContent='연결 중…'; }
  }

  /* ===== 렌더: 카테고리 필터 옵션 ===== */
  function distinctCats(){
    var s={}, list=[];
    items.forEach(function(it){ var c=(it.category||'').trim()||'미분류'; if(!s[c]){ s[c]=1; list.push(c); } });
    list.sort(function(a,b){ return a.localeCompare(b,'ko'); });
    return list;
  }
  function refreshCatUI(){
    var cats=distinctCats();
    var sel=$('catFilter'), keep=sel.value;
    sel.innerHTML='<option value="">전체 카테고리</option>'+cats.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');
    if(cats.indexOf(keep)>=0) sel.value=keep; else { sel.value=''; filterCat=''; }
    var dl=$('catList'); if(dl) dl.innerHTML=cats.filter(function(c){return c!=='미분류';}).map(function(c){ return '<option value="'+esc(c)+'">'; }).join('');
  }

  /* ===== 렌더: 본문 ===== */
  function matchSearch(it){
    if(!searchQ) return true;
    var q=searchQ.toLowerCase();
    if((it.category||'').toLowerCase().indexOf(q)>=0) return true;
    var v=it.values||{};
    for(var k in v){ if(String(v[k]==null?'':v[k]).toLowerCase().indexOf(q)>=0) return true; }
    return false;
  }
  function renderList(){
    var box=$('idList');
    // 필드가 하나도 없을 때
    if(!fields.length && !items.length){
      box.innerHTML='<div class="id-empty"><div class="em-ic">🗂</div><div class="em-t">아직 필드가 없습니다</div>'+
        '<div class="em-s">먼저 <b>필드 관리</b>에서 상품에 사용할 필드를 추가하세요.<br>(UPC 매니저와 동일한 필드 형태 · 지금은 비어 있음)</div>'+
        '<button class="id-btn primary" onclick="document.getElementById(\'btnFields\').click()">🗂 필드 관리 열기</button></div>';
      return;
    }
    var view=items.filter(function(it){
      if(filterCat){ var c=(it.category||'').trim()||'미분류'; if(c!==filterCat) return false; }
      return matchSearch(it);
    });
    if(!view.length){
      box.innerHTML='<div class="id-empty"><div class="em-ic">🛒</div><div class="em-t">'+(items.length? '조건에 맞는 상품이 없습니다':'등록된 상품이 없습니다')+'</div>'+
        '<div class="em-s">'+(items.length? '검색어·카테고리 필터를 확인하세요.':'상단 <b>＋ 상품등록</b>으로 첫 상품을 추가하세요.')+'</div></div>';
      return;
    }
    // 카테고리별 그룹
    var groups={}, order=[];
    view.forEach(function(it){ var c=(it.category||'').trim()||'미분류'; if(!groups[c]){ groups[c]=[]; order.push(c); } groups[c].push(it); });
    order.sort(function(a,b){ return a.localeCompare(b,'ko'); });
    var cols=fields; // 표시 필드
    var html='';
    order.forEach(function(cat){
      var rows=groups[cat];
      html+='<div class="id-cat"><div class="id-cat-head"><span class="id-cat-tick"></span><span class="id-cat-name">'+esc(cat)+'</span><span class="id-cat-count">'+rows.length+'개</span></div>';
      html+='<div class="id-tablewrap"><table class="id-table"><thead><tr>';
      cols.forEach(function(f){ html+='<th>'+esc(f.label)+'</th>'; });
      if(!cols.length) html+='<th style="color:var(--text-faint);">필드 없음 — 필드 관리에서 추가</th>';
      html+='<th class="id-row-actions"></th></tr></thead><tbody>';
      rows.forEach(function(it){
        html+='<tr data-id="'+esc(it.id)+'">';
        cols.forEach(function(f){
          var v=(it.values||{})[f.key];
          html+='<td class="'+tdClass(f.type)+'">'+fmtValue(f, v)+'</td>';
        });
        if(!cols.length) html+='<td class="id-chk-off">·</td>';
        html+='<td class="id-row-actions"><button class="id-mini" data-edit="'+esc(it.id)+'" type="button">변경</button> '+
              '<button class="id-mini del" data-del="'+esc(it.id)+'" type="button">삭제</button></td>';
        html+='</tr>';
      });
      html+='</tbody></table></div></div>';
    });
    box.innerHTML=html;
    // 행/버튼 배선
    box.querySelectorAll('tr[data-id]').forEach(function(tr){
      tr.onclick=function(e){ if(e.target.closest('button')) return; openItem(tr.getAttribute('data-id')); };
    });
    box.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ openItem(b.getAttribute('data-edit')); }; });
    box.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ deleteItem(b.getAttribute('data-del')); }; });
  }

  /* ===== 상품 등록/변경 모달 ===== */
  function buildItemForm(it){
    var box=$('itemFields');
    if(!fields.length){ box.innerHTML='<div class="mf-empty">등록된 필드가 없습니다. 먼저 <b>필드 관리</b>에서 필드를 추가하세요.</div>'; return; }
    var vals=(it&&it.values)||{};
    box.innerHTML=fields.map(function(f){
      var t=normType(f.type), cur=vals[f.key];
      if(isCheck(t)){
        return '<div class="id-fld"><div class="id-check-fld"><span>'+esc(f.label)+' <small style="color:var(--text-faint);font-weight:700;">('+typeLabel(t)+')</small></span>'+
          '<input type="checkbox" class="if-in" data-k="'+esc(f.key)+'" data-t="'+t+'"'+(cur?' checked':'')+'></div></div>';
      }
      if(isNum(t)){
        var unit=(t==='price'?'$':'%');
        return '<div class="id-fld"><label>'+esc(f.label)+' <small style="color:var(--text-faint);">('+typeLabel(t)+')</small></label>'+
          '<div class="with-unit"><input type="number" step="0.01" class="if-in" data-k="'+esc(f.key)+'" data-t="'+t+'" value="'+esc(cur==null?'':cur)+'" placeholder="0"><span class="unit">'+unit+'</span></div></div>';
      }
      return '<div class="id-fld"><label>'+esc(f.label)+'</label>'+
        '<input type="text" class="if-in" data-k="'+esc(f.key)+'" data-t="text" value="'+esc(cur==null?'':cur)+'" autocomplete="off"></div>';
    }).join('');
  }
  function openItem(id){
    editingId=id||null;
    var it=id?items.filter(function(x){return x.id===id;})[0]:null;
    $('itemTitle').textContent = it?'상품 변경':'상품 등록';
    $('itemSub').textContent = it?'값을 수정하고 저장하세요.':'카테고리와 필드 값을 입력하세요.';
    $('itemCat').value = it?(it.category||''):'';
    buildItemForm(it);
    $('itemDelete').style.display = it?'inline-block':'none';
    $('itemOv').classList.add('show');
    setTimeout(function(){ $('itemCat').focus(); }, 60);
  }
  function closeItem(){ $('itemOv').classList.remove('show'); editingId=null; }
  async function saveItem(){
    if(!ready()){ toast('연결 대기 중… 잠시 후 다시'); return; }
    var cat=($('itemCat').value||'').trim();
    var values={};
    $('itemFields').querySelectorAll('.if-in').forEach(function(inp){
      var k=inp.getAttribute('data-k'), t=inp.getAttribute('data-t');
      if(isCheck(t)) values[k]=!!inp.checked;
      else values[k]=(inp.value||'').trim();
    });
    var id=editingId || ('it'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    var rec={ id:id, category:cat, values:values, updatedAt:Date.now() };
    try{
      await fb().setDoc(fb().doc(fb().db, ITEM_COL, id), rec);
      toast(editingId?'변경 저장됨':'상품 등록됨');
      closeItem();
    }catch(e){ toast('저장 실패 — 규칙/연결 확인'); }
  }
  async function deleteItem(id){
    if(!id) return;
    var it=items.filter(function(x){return x.id===id;})[0];
    if(!confirm('['+((it&&it.category)||'')+'] 상품을 삭제할까요?')) return;
    if(!ready()){ toast('연결 대기 중…'); return; }
    try{ await fb().deleteDoc(fb().doc(fb().db, ITEM_COL, id)); toast('삭제됨'); if(editingId===id) closeItem(); }
    catch(e){ toast('삭제 실패 — 규칙/연결 확인'); }
  }

  /* ===== 필드 관리 모달 ===== */
  function renderMF(){
    var box=$('mfList');
    if(!fields.length){ box.innerHTML='<div class="mf-empty">아직 필드가 없습니다. 위에서 필드를 추가하세요.</div>'; return; }
    box.innerHTML=fields.map(function(f,i){
      return '<div class="mf-row" data-i="'+i+'">'+
        '<div class="mf-ord"><button data-up="'+i+'" type="button" title="위로">▲</button><button data-down="'+i+'" type="button" title="아래로">▼</button></div>'+
        '<input class="mf-name" data-i="'+i+'" value="'+esc(f.label)+'" maxlength="40">'+
        '<select class="mf-type" data-i="'+i+'">'+
          ['text','rcheck','check','price','margin'].map(function(t){ return '<option value="'+t+'"'+(normType(f.type)===t?' selected':'')+'>'+typeLabel(t)+'</option>'; }).join('')+
        '</select>'+
        '<button class="mf-del" data-del="'+i+'" type="button">삭제</button>'+
      '</div>';
    }).join('');
    box.querySelectorAll('.mf-name').forEach(function(inp){ var i=+inp.getAttribute('data-i');
      inp.onchange=function(){ var nm=(inp.value||'').trim(); if(!nm){ renderMF(); return; } fields[i].label=nm; fields[i].key=nm.toUpperCase(); saveFields('필드명 변경됨'); };
    });
    box.querySelectorAll('.mf-type').forEach(function(sel){ var i=+sel.getAttribute('data-i');
      sel.onchange=function(){ fields[i].type=normType(sel.value); saveFields('필드 타입 변경됨'); };
    });
    box.querySelectorAll('[data-up]').forEach(function(b){ var i=+b.getAttribute('data-up');
      b.onclick=function(){ if(i<=0) return; var t=fields[i-1]; fields[i-1]=fields[i]; fields[i]=t; saveFields(); };
    });
    box.querySelectorAll('[data-down]').forEach(function(b){ var i=+b.getAttribute('data-down');
      b.onclick=function(){ if(i>=fields.length-1) return; var t=fields[i+1]; fields[i+1]=fields[i]; fields[i]=t; saveFields(); };
    });
    box.querySelectorAll('[data-del]').forEach(function(b){ var i=+b.getAttribute('data-del');
      b.onclick=function(){ var f=fields[i]; if(!confirm('필드 ['+f.label+']를 삭제할까요?\n(이미 입력된 상품 값에는 영향 없음)')) return; fields.splice(i,1); saveFields('필드 삭제됨'); };
    });
  }
  function addField(){
    var nm=($('mfNewName').value||'').trim(); if(!nm){ $('mfNewName').focus(); return; }
    var K=nm.toUpperCase();
    if(fields.some(function(f){return f.key===K;})){ alert('이미 있는 필드입니다'); $('mfNewName').select(); return; }
    fields.push({ key:K, label:nm, type:normType($('mfNewType').value) });
    $('mfNewName').value=''; saveFields('필드 추가됨 · '+nm); $('mfNewName').focus();
  }
  async function saveFields(msg){
    fields=normFields(fields);
    renderMF(); renderList();
    if(!ready()){ toast('연결 대기 중…'); return; }
    try{ await fb().setDoc(fb().doc(fb().db, CFG_COL, CFG_DOC), { fields:fields, updatedAt:Date.now() }, { merge:true }); if(msg) toast(msg); }
    catch(e){ toast('필드 저장 실패 — 규칙 확인'); }
  }

  /* ===== 실시간 구독 ===== */
  function subscribe(){
    if(!ready()){ setTimeout(subscribe, 400); return; }
    setSync('wait');
    // 필드
    try{
      fb().onSnapshot(fb().doc(fb().db, CFG_COL, CFG_DOC), function(snap){
        var d=(snap&&snap.exists&&snap.exists())?(snap.data()||{}):{};
        fields=normFields(Array.isArray(d.fields)?d.fields:[]);
        if($('fieldsOv').classList.contains('show')) renderMF();
        renderList();
      }, function(){ /* ignore */ });
    }catch(e){}
    // 상품
    try{
      fb().onSnapshot(fb().collection(fb().db, ITEM_COL), function(snap){
        var arr=[]; snap.forEach(function(ds){ var d=ds.data()||{}; arr.push({ id:ds.id, category:d.category||'', values:d.values||{}, updatedAt:d.updatedAt||0 }); });
        arr.sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
        items=arr;
        setSync('on');
        refreshCatUI(); renderList();
      }, function(){ setSync('off'); });
    }catch(e){ setSync('off'); }
  }

  /* ===== 배선 ===== */
  $('idBack').onclick=function(){ location.href='doordash.html'; };
  $('btnAdd').onclick=function(){ openItem(null); };
  $('btnFields').onclick=function(){ $('fieldsOv').classList.add('show'); renderMF(); setTimeout(function(){ $('mfNewName').focus(); },60); };
  $('fieldsClose').onclick=function(){ $('fieldsOv').classList.remove('show'); };
  $('fieldsOv').addEventListener('click', function(e){ if(e.target===$('fieldsOv')) $('fieldsOv').classList.remove('show'); });
  $('mfAdd').onclick=addField;
  $('mfNewName').addEventListener('keydown', function(e){ if(e.key==='Enter') addField(); });

  $('itemClose').onclick=closeItem;
  $('itemCancel').onclick=closeItem;
  $('itemSave').onclick=saveItem;
  $('itemDelete').onclick=function(){ if(editingId) deleteItem(editingId); };
  $('itemOv').addEventListener('click', function(e){ if(e.target===$('itemOv')) closeItem(); });

  $('searchInput').addEventListener('input', function(){ searchQ=(this.value||'').trim(); renderList(); });
  $('catFilter').addEventListener('change', function(){ filterCat=this.value||''; renderList(); });

  window.addEventListener('idfb-ready', subscribe);
  if(ready()) subscribe(); else setTimeout(subscribe, 300);
})();
</script>
</body>
</html>
