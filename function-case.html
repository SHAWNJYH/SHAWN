<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대소문자 변환</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ --gold:#c9a961; --gold-d:#b08d3f; --ink:#1f2430; --sub:#6b7280; --line:#e5e7eb; --bg2:#f6f7f9; }
  *{ box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif; }
  html,body{ height:100%; }
  body{ background:#eef0f4; display:flex; align-items:center; justify-content:center; overflow:hidden; }

  /* ── 크기 토큰 (S/M/L 은 body 클래스) ───────────────── */
  body.sz-s{ --fs:11.5px; --fs-sm:10px;  --pad:9px;  --gap:6px;  --btn-h:26px; --keyh:30px; --key-fs:12.5px; --res-fs:19px; --rad:11px; --rad-in:8px;  --card-w:280px; --card-h:410px; }
  body.sz-m{ --fs:13px;   --fs-sm:11px;  --pad:12px; --gap:8px;  --btn-h:32px; --keyh:40px; --key-fs:15px;   --res-fs:24px; --rad:14px; --rad-in:10px; --card-w:350px; --card-h:510px; }
  body.sz-l{ --fs:14.5px; --fs-sm:12px;  --pad:16px; --gap:10px; --btn-h:38px; --keyh:50px; --key-fs:17px;   --res-fs:30px; --rad:16px; --rad-in:11px; --card-w:430px; --card-h:630px; }

  /* ── 카드: 단독 실행 시 고정 크기(4개 도구 완전 동일), iframe(embed) 시 꽉 채움 ── */
  #card{ width:var(--card-w); height:var(--card-h); background:#fff; border:1px solid var(--line);
    border-radius:var(--rad); overflow:hidden; box-shadow:0 12px 34px rgba(15,20,40,.10);
    display:flex; flex-direction:column; font-size:var(--fs); color:var(--ink);
    transition:width .18s, height .18s; }
  body.embed{ background:#fff; }
  body.embed #card{ width:100vw; height:100vh; border:0; border-radius:0; box-shadow:none; transition:none; }

  /* ── 헤더: 제목 + S M L ───────────────────────────── */
  #head{ flex:none; display:flex; align-items:center; gap:8px; padding:calc(var(--pad)*.62) var(--pad);
    background:linear-gradient(135deg,#1a1a2e 0%,#2d2d44 100%); }
  #head .tick{ width:4px; height:1.05em; border-radius:2px; background:var(--gold); flex:none; }
  #head .tt{ color:#fff; font-weight:700; font-size:calc(var(--fs) + 1px); letter-spacing:.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #head .sp{ flex:1; }
  .sml{ display:flex; gap:3px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16);
    border-radius:9px; padding:2px; flex:none; }
  .sml button{ border:0; background:transparent; color:rgba(255,255,255,.66); font-size:var(--fs-sm);
    font-weight:800; width:2.1em; height:1.9em; border-radius:7px; cursor:pointer; line-height:1;
    transition:background .13s,color .13s; }
  .sml button.on{ background:linear-gradient(135deg,var(--gold),var(--gold-d)); color:#fff; }

  /* ── 본문 공통 ───────────────────────────────────── */
  #bodyc{ flex:1; min-height:0; padding:var(--pad); display:flex; flex-direction:column; gap:var(--gap); }
  .lbl{ flex:none; display:flex; align-items:center; justify-content:space-between;
    font-size:var(--fs-sm); color:var(--sub); font-weight:600; letter-spacing:.02em; }
  .lbl .st{ font-weight:500; color:var(--gold-d); }
  .ta{ flex:1; min-height:0; width:100%; resize:none; border:1px solid var(--line); border-radius:var(--rad-in);
    padding:calc(var(--pad)*.6); font-size:var(--fs); line-height:1.5; background:var(--bg2);
    color:var(--ink); outline:none; }
  .ta:focus{ border-color:var(--gold); background:#fff; box-shadow:0 0 0 3px rgba(201,169,97,.15); }
  .row{ flex:none; display:flex; gap:var(--gap); flex-wrap:nowrap; }
  .row .grow{ flex:1; }
  .btn{ height:var(--btn-h); padding:0 calc(var(--pad)*.7); border:1px solid var(--line); border-radius:var(--rad-in);
    background:var(--bg2); color:var(--ink); font-size:var(--fs); font-weight:600; cursor:pointer;
    transition:background .13s, transform .08s; white-space:nowrap; }
  .btn:hover{ background:#eef0f3; } .btn:active{ transform:scale(.97); }
  .btn.gold{ background:linear-gradient(135deg,var(--gold),var(--gold-d)); color:#fff; border:0; }
  .btn.gold:hover{ filter:brightness(1.06); }
  .btn.ghost{ background:transparent; }

  /* ── 토스트 ─────────────────────────────────────── */
  .toast{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(8px); z-index:99;
    background:rgba(26,26,46,.94); color:#fff; font-size:12px; font-weight:600; padding:8px 16px;
    border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.28); opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err{ background:rgba(190,50,50,.95); }
</style>
</head>
<body class="sz-m">

<div id="card">
  <div id="head">
    <span class="tick"></span>
    <span class="tt">🔤 대소문자 변환</span>
    <span class="sp"></span>
    <div class="sml">
      <button data-s="s">S</button>
      <button data-s="m">M</button>
      <button data-s="l">L</button>
    </div>
  </div>
  <div id="bodyc">
    <div class="lbl"><span>입력</span><span class="st" id="ist">0자</span></div>
    <textarea class="ta" id="in" placeholder="변환할 텍스트를 입력하세요"></textarea>
    <div class="row">
      <button class="btn gold grow" id="up">대문자</button>
      <button class="btn gold grow" id="low">소문자</button>
      <button class="btn gold grow" id="tit">첫글자</button>
    </div>
    <div class="lbl"><span>결과</span><span class="st" id="ost">0자</span></div>
    <textarea class="ta" id="out" placeholder="변환 결과" readonly></textarea>
    <div class="row">
      <button class="btn" id="paste">붙여넣기</button>
      <button class="btn grow" id="copy">결과 복사</button>
      <button class="btn ghost" id="cboth">모두 지우기</button>
    </div>
  </div>
</div>

<script>
/* ── 로직 모듈(원본 그대로 내장 — 외부 파일 의존 없음) ── */
/* ============================================================
   Function-Case-Converter.js
   공용 대소문자 변환 모듈 (로그인 메뉴 / EGMM(ODP) / 추후 H-MART 공통)
   - window.FunctionCase.toUpper/toLower/toTitle(text) : 순수 함수
   - window.FunctionCase.wire(cfg)                     : 화면 요소(id) 연결
   cfg 예시:
     { input, output, upperBtn, lowerBtn, titleBtn,
       copyBtn, pasteBtn, clearInputBtn, clearOutputBtn,
       inputStatus, outputStatus }
   없는 요소는 자동으로 건너뜁니다.
   ============================================================ */
(function () {
  'use strict';

  function toUpper(t) { return t.toUpperCase(); }
  function toLower(t) { return t.toLowerCase(); }
  function toTitle(t) { return t.replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }

  var $ = function (id) { return document.getElementById(id); };
  function toast(msg, type) { if (window.showToast) window.showToast(msg, type); }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    toast('✅ 복사되었습니다!', 'success');
  }
  function copyOut(text) {
    if (!text) { toast('복사할 내용이 없습니다', 'error'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { toast('✅ 복사되었습니다!', 'success'); })
        .catch(function () { fallbackCopy(text); });
    } else { fallbackCopy(text); }
  }

  function wire(cfg) {
    cfg = cfg || {};
    var input = $(cfg.input), output = $(cfg.output);
    if (!input || !output) return null;

    function updateIn() {
      if (cfg.inputStatus && $(cfg.inputStatus)) $(cfg.inputStatus).textContent = input.value.length + '자';
    }
    function updateOut() {
      if (cfg.outputStatus && $(cfg.outputStatus)) $(cfg.outputStatus).textContent = output.value.length + '자';
    }
    function convert(mode) {
      if (!input.value.trim()) { toast('변환할 텍스트를 입력하세요', 'error'); input.focus(); return; }
      var result, label;
      if (mode === 'upper') { result = toUpper(input.value); label = '전부 대문자'; }
      else if (mode === 'lower') { result = toLower(input.value); label = '전부 소문자'; }
      else { result = toTitle(input.value); label = '첫글자 대문자'; }
      output.value = result;
      updateOut();
      toast('✅ ' + label + ' 변환 완료!', 'success');
    }

    if (cfg.upperBtn && $(cfg.upperBtn)) $(cfg.upperBtn).onclick = function () { convert('upper'); };
    if (cfg.lowerBtn && $(cfg.lowerBtn)) $(cfg.lowerBtn).onclick = function () { convert('lower'); };
    if (cfg.titleBtn && $(cfg.titleBtn)) $(cfg.titleBtn).onclick = function () { convert('title'); };

    input.addEventListener('input', updateIn);

    if (cfg.clearInputBtn && $(cfg.clearInputBtn))
      $(cfg.clearInputBtn).onclick = function () { input.value = ''; updateIn(); input.focus(); };
    if (cfg.clearOutputBtn && $(cfg.clearOutputBtn))
      $(cfg.clearOutputBtn).onclick = function () { output.value = ''; updateOut(); };
    if (cfg.copyBtn && $(cfg.copyBtn))
      $(cfg.copyBtn).onclick = function () { copyOut(output.value); };
    if (cfg.pasteBtn && $(cfg.pasteBtn))
      $(cfg.pasteBtn).onclick = function () {
        if (navigator.clipboard && navigator.clipboard.readText) {
          navigator.clipboard.readText()
            .then(function (t) { input.value = t; updateIn(); toast('붙여넣기 완료', 'success'); })
            .catch(function () { toast('직접 Ctrl+V 로 붙여넣어 주세요', 'error'); });
        } else { toast('직접 Ctrl+V 로 붙여넣어 주세요', 'error'); }
      };

    updateIn();
    updateOut();
    return { convert: convert };
  }

  window.FunctionCase = { toUpper: toUpper, toLower: toLower, toTitle: toTitle, wire: wire };
})();

</script>
<script>

  var $=function(id){ return document.getElementById(id); };
  /* 토스트 */
  window.showToast=function(msg,type){
    var t=document.createElement('div'); t.className='toast'+(type==='error'?' err':''); t.textContent=msg;
    document.body.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },250); },1700);
  };
  /* iframe(멀티뷰 패널/팝업) 안에서는 카드가 화면을 꽉 채움 */
  try{ if(window.self!==window.top || /[?&]embed=1/.test(location.search)) document.body.classList.add('embed'); }catch(e){ document.body.classList.add('embed'); }
  /* S/M/L — 4개 도구가 공유하는 저장 키(브라우저별 유지) */
  (function(){
    var KEY='shawnFnToolSize';
    var cur=localStorage.getItem(KEY); if(cur!=='s'&&cur!=='m'&&cur!=='l') cur='m';
    function apply(s){
      cur=s;
      document.body.classList.remove('sz-s','sz-m','sz-l');
      document.body.classList.add('sz-'+s);
      var bs=document.querySelectorAll('.sml button');
      Array.prototype.forEach.call(bs,function(b){ b.classList.toggle('on', b.dataset.s===s); });
      try{ localStorage.setItem(KEY,s); }catch(e){}
    }
    document.querySelector('.sml').addEventListener('click',function(e){
      var b=e.target.closest('button'); if(b) apply(b.dataset.s);
    });
    apply(cur);
  })();

  /* 화면 연결 */
  var caseApi=FunctionCase.wire({ input:'in', output:'out', upperBtn:'up', lowerBtn:'low', titleBtn:'tit',
    copyBtn:'copy', pasteBtn:'paste', inputStatus:'ist', outputStatus:'ost' });
  /* 모두 지우기(모듈에는 없는 통합 버튼) */
  $('cboth').onclick=function(){ $('in').value=''; $('out').value='';
    $('ist').textContent='0자'; $('ost').textContent='0자'; $('in').focus(); };
</script>
</body>
</html>
