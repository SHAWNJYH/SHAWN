<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>DOORDASH · THE SHAWN</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  try {
    const app = initializeApp({
      apiKey: "AIzaSyC6t78BS99LX3261cRmApBG8AcZ8HPVxr0",
      authDomain: "the-shawn.firebaseapp.com",
      projectId: "the-shawn",
      storageBucket: "the-shawn.firebasestorage.app",
      messagingSenderId: "519898602513",
      appId: "1:519898602513:web:0f35e3dc9c29dce21665b0",
      measurementId: "G-NKGYGC63JN"
    });
    const db = getFirestore(app);
    const auth = getAuth(app);
    // 게이트는 열린 컬렉션(app-config)만 읽으므로 인증을 기다리지 않고 즉시 준비한다.
    // (익명 인증이 아직 없어도 아이디 목록이 무한 대기하지 않도록)
    window.ddFb = { db, doc, getDoc, setDoc, onSnapshot, auth, uid: null };
    window.dispatchEvent(new Event('ddfb-ready'));
    // 익명 인증은 백그라운드로 시작 — 이후 item-management 페이지에서 쓸 세션을 미리 만들어 둔다.
    onAuthStateChanged(auth, (user) => { if (user && window.ddFb) window.ddFb.uid = user.uid; });
    signInAnonymously(auth).catch((e) => {
      console.error('anonymous auth fail (gate)', e);
    });
  } catch (e) { console.error('firebase init fail', e); }
</script>
<style>
  :root{
    --bg:#fafaf7; --bg-elev:#ffffff; --bg-elev-2:#f3f3ee; --border:#e5e5e0; --border-bright:#c8c8c0;
    --text:#1a1a1d; --text-dim:#6b6b72; --text-faint:#9a9aa0; --accent:#1a1a1d; --accent-warm:#c9a961; --accent-soft:#f0eee5;
    --danger:#c83a3a; --success:#2a8a4a;
    --mono:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--mono); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(201,169,97,0.05) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(26,26,29,0.03) 0%, transparent 40%);
  }

  /* ===== 로그인 (아이디/패스워드) ===== */
  .lock-screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .lock-card{
    width:100%; max-width:400px; background:var(--bg-elev); border:1px solid var(--border);
    border-radius:16px; padding:40px 32px 32px; box-shadow:0 10px 40px rgba(26,26,29,0.06);
  }
  .lock-eyebrow{ font-size:12px; font-weight:800; letter-spacing:.22em; color:var(--accent-warm); text-align:center; text-transform:uppercase; margin-bottom:10px; }
  .lock-title{ font-weight:800; font-size:30px; line-height:1.15; text-align:center; color:var(--text); margin-bottom:26px; letter-spacing:.01em; }
  .lock-title .dot{ color:var(--accent-warm); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select{
    width:100%; background:var(--bg); border:1.5px solid var(--border); color:var(--text);
    padding:12px 14px; font-family:var(--mono); font-size:15px; border-radius:10px; transition:border-color .2s, background .2s;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent-warm); background:#fff; }
  .lock-auto{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--text-dim); margin:2px 2px 4px; cursor:pointer; user-select:none; }
  .lock-auto input{ accent-color:var(--accent-warm); width:18px; height:18px; cursor:pointer; }
  .btn{
    width:100%; background:var(--accent); color:#fff; border:none; padding:13px; font-family:var(--mono);
    font-size:14px; font-weight:700; cursor:pointer; border-radius:10px; transition:transform .15s, background .2s; margin-top:12px;
  }
  .btn:hover{ background:#2d2d33; }
  .btn:active{ transform:scale(.98); }
  .err{ color:var(--danger); font-size:13px; text-align:center; margin-top:14px; min-height:16px; font-weight:600; }
  .lock-note{ font-size:12px; color:var(--text-faint); text-align:center; margin-top:14px; line-height:1.6; }

  /* ===== 메인 메뉴 ===== */
  .cw-menu{ display:none; position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:56px 32px 90px; }
  .cw-menu.active{ display:block; }
  .cw-masthead{ margin-bottom:36px; }
  .cw-eyebrow{ font-size:12px; font-weight:800; letter-spacing:.22em; color:var(--accent-warm); text-transform:uppercase; }
  .cw-wordmark{ font-size:46px; font-weight:800; line-height:1.1; letter-spacing:.01em; margin-top:6px; }
  .cw-wordmark .dot{ color:var(--accent-warm); }
  .cw-rule{ height:3px; width:64px; background:var(--accent-warm); border-radius:2px; margin-top:14px; }
  .cw-userline{ display:flex; align-items:center; gap:10px; margin-top:14px; font-size:13px; font-weight:700; color:var(--text-dim); }
  .cw-userline b{ color:var(--text); }
  .cw-logout{
    border:1.5px solid var(--border); background:var(--bg-elev); color:var(--text-dim); border-radius:9px;
    padding:6px 13px; font-family:var(--mono); font-size:12px; font-weight:800; cursor:pointer; transition:all .15s;
  }
  .cw-logout:hover{ border-color:var(--danger); color:var(--danger); background:#fff0f0; }

  .cw-cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px; align-items:start; }
  .cw-card{
    background:var(--bg-elev); border:1.5px solid var(--border); border-radius:16px; padding:18px 16px 14px;
    box-shadow:0 6px 22px rgba(26,26,29,0.04);
  }
  .cw-card-head{ display:flex; align-items:center; gap:9px; margin-bottom:12px; }
  .cw-card-tick{ width:9px; height:9px; border-radius:3px; background:var(--accent-warm); flex:0 0 auto; }
  .cw-card-name{ font-size:16px; font-weight:800; letter-spacing:.04em; }
  .cw-section-title{ font-size:11px; font-weight:800; letter-spacing:.14em; color:var(--text-faint); text-transform:uppercase; margin:4px 2px 7px; }
  .cw-section-title.gap{ margin-top:14px; }
  .cw-menu-btn{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--bg); border:1.5px solid var(--border); color:var(--text); border-radius:11px;
    padding:12px 13px; font-family:var(--mono); font-size:13.5px; font-weight:800; cursor:pointer;
    transition:all .15s; margin-bottom:7px; text-align:left;
  }
  .cw-menu-btn:hover{ border-color:var(--accent-warm); background:var(--accent-soft); }
  .cw-menu-btn:active{ transform:scale(.985); }
  .cw-menu-btn .arrow{ color:var(--text-faint); transition:transform .15s, color .15s; }
  .cw-menu-btn:hover .arrow{ color:var(--accent-warm); transform:translateX(3px); }
  .cw-menu-btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .cw-menu-btn.primary:hover{ background:#000; }
  .cw-menu-btn.primary .arrow{ color:rgba(255,255,255,.65); }
  .cw-menu-btn.disabled{ opacity:.45; cursor:not-allowed; }
  .cw-menu-btn.disabled:hover{ border-color:var(--border); background:var(--bg); }
  .cw-foot{ margin-top:44px; font-size:12px; color:var(--text-faint); font-weight:600; }

  .cw-masthead{ text-align:center; margin-bottom:44px; }
  .cw-rule{ margin:14px auto 0; }
  .cw-userline{ justify-content:center; }
  .cw-single{ display:flex; justify-content:center; }
  .cw-menu-btn.cw-big{ width:min(440px,100%); padding:18px 22px; font-size:15.5px; border-radius:14px; box-shadow:0 10px 30px rgba(26,26,29,0.12); }
  @media (max-width:640px){
    .cw-menu{ padding:32px 16px 70px; }
    .cw-wordmark{ font-size:34px; }
  }
</style>
</head>
<body>
<!-- ===== 로그인 게이트 ===== -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <h1 class="lock-title">DOORDASH<span class="dot">.</span></h1>
    <div class="field">
      <label for="cwUserPick">아이디</label>
      <select id="cwUserPick"><option value="">불러오는 중…</option></select>
    </div>
    <div class="field">
      <label for="cwPwInput">PASSWORD</label>
      <input id="cwPwInput" type="password" placeholder="PASSWORD" autocomplete="current-password">
    </div>
    <div class="err" id="cwErr"></div>
    <label class="lock-auto"><input type="checkbox" id="cwAutoChk"> 자동 로그인</label>
    <button class="btn" id="cwLoginBtn" type="button">입장</button>
  </div>
</div>

<!-- ===== 메인 메뉴 ===== -->
<div class="cw-menu" id="cwMenu">
  <div class="cw-masthead">
    <div class="cw-wordmark">DOORDASH<span class="dot">.</span></div>
    <div class="cw-rule"></div>
    <div class="cw-userline"><span id="cwHello"></span><button class="cw-logout" id="cwLogoutBtn" type="button">로그아웃</button></div>
  </div>

  <div class="cw-single">
    <button class="cw-menu-btn primary cw-big" data-go="item-management-doordash.html"><span>ITEM MANAGEMENT</span><span class="arrow">→</span></button>
  </div>

</div>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  /* 계정은 STORE MANAGER → 아이디/패스워드 관리에서 'DOORDASH' 를 체크한 아이디만
     app-config/doordash-users 에 저장된다(EGMM·CAMPEON 과 동일한 스코프 구조).
     즉 이 문서에 있으면 곧 DOORDASH 입장 권한이 있는 것. */
  var AUTH_COL='app-config', AUTH_DOC='doordash-users';
  var GATE_KEY='doordashGate', USER_KEY='doordashUser', AUTO_KEY='doordashAutoLogin';
  var users=[];

  /* index.html 과 동일한 해시 방식 (SHA-256 'THE-SHAWN::'+v → 'h:', 폴백 'p:') */
  async function hashPin(v){
    v=String(v);
    if(window.crypto && window.crypto.subtle){
      try{ var buf=await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode('THE-SHAWN::'+v));
        return 'h:'+Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join(''); }catch(e){}
    }
    return 'p:'+v;
  }
  async function matchPin(entered, stored){
    entered=String(entered||'').trim(); stored=String(stored||'');
    if(stored.slice(0,2)==='h:'||stored.slice(0,2)==='p:') return (await hashPin(entered))===stored;
    return entered===stored;   // 레거시 평문
  }

  function isAuto(){ try{ return localStorage.getItem(AUTO_KEY)==='1'; }catch(e){ return false; } }
  function gateOn(){ try{ return sessionStorage.getItem(GATE_KEY)==='1' || isAuto(); }catch(e){ return false; } }
  function savedUser(){ try{ return JSON.parse(sessionStorage.getItem(USER_KEY)||localStorage.getItem(USER_KEY)||'null'); }catch(e){ return null; } }

  function showMenu(){
    $('lockScreen').style.display='none';
    $('cwMenu').classList.add('active');
    var u=savedUser();
    $('cwHello').innerHTML = u&&u.name ? ('<b>'+String(u.name).replace(/</g,'&lt;')+'</b> 님, 환영합니다.') : '환영합니다.';
  }
  function showLock(){
    $('cwMenu').classList.remove('active');
    $('lockScreen').style.display='flex';
    var chk=$('cwAutoChk'); if(chk) chk.checked=isAuto();
    setTimeout(function(){ var p=$('cwPwInput'); if(p) p.focus(); }, 80);
  }

  function fillUsers(){
    var sel=$('cwUserPick'); if(!sel) return;
    if(!users.length){ sel.innerHTML='<option value="">등록된 아이디 없음</option>'; return; }
    sel.innerHTML=users.map(function(u,i){ return '<option value="'+i+'">'+String(u.name||'').replace(/</g,'&lt;')+'</option>'; }).join('');
  }
  function loadUsers(){
    var fb=window.ddFb;
    if(!fb||!fb.getDoc){ setTimeout(loadUsers,400); return; }
    fb.getDoc(fb.doc(fb.db,AUTH_COL,AUTH_DOC)).then(function(snap){
      var d=(snap&&snap.exists&&snap.exists())?(snap.data()||{}):{};
      users=Array.isArray(d.users)?d.users.filter(function(u){return u&&u.name;}):[];
      fillUsers();
    }).catch(function(){ var sel=$('cwUserPick'); if(sel) sel.innerHTML='<option value="">불러오기 실패 — 새로고침</option>'; });
  }

  async function submit(){
    var err=$('cwErr'); if(err) err.textContent='';
    var sel=$('cwUserPick'), pw=($('cwPwInput')&&$('cwPwInput').value||'').trim();
    var i=sel?parseInt(sel.value,10):NaN;
    var u=(!isNaN(i)&&users[i])?users[i]:null;
    if(!u){ if(err) err.textContent='아이디를 선택하세요'; return; }
    if(!pw){ if(err) err.textContent='PASSWORD 를 입력하세요'; $('cwPwInput').focus(); return; }
    if(await matchPin(pw, u.pin)){
      try{
        sessionStorage.setItem(GATE_KEY,'1');
        var uj=JSON.stringify({name:u.name, id:u.id||'', menus:u.menus||{}});
        sessionStorage.setItem(USER_KEY, uj);
        var auto=$('cwAutoChk')&&$('cwAutoChk').checked;
        localStorage.setItem(AUTO_KEY, auto?'1':'0');
        if(auto) localStorage.setItem(USER_KEY, uj); else localStorage.removeItem(USER_KEY);
      }catch(e){}
      showMenu();
    } else {
      if(err) err.textContent='PASSWORD 가 올바르지 않습니다';
      $('cwPwInput').select();
    }
  }

  $('cwLoginBtn').onclick=submit;
  $('cwPwInput').addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  $('cwLogoutBtn').onclick=function(){
    try{ sessionStorage.removeItem(GATE_KEY); sessionStorage.removeItem(USER_KEY); localStorage.setItem(AUTO_KEY,'0'); localStorage.removeItem(USER_KEY); }catch(e){}
    showLock();
  };
  document.querySelectorAll('.cw-menu-btn[data-go]').forEach(function(b){
    b.onclick=function(){ if(b.classList.contains('disabled')) return; location.href=b.getAttribute('data-go'); };
  });

  loadUsers();
  if(gateOn()) showMenu(); else showLock();
})();
</script>
</body>
</html>
